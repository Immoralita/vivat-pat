<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivat-Pat | Карта Возрождения</title>
    <!-- Подключаем карту Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
            background-color: #e8dcc4; 
        }

        /* Выезжающая панель */
        #panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 350px;
            height: 100%;
            background-color: rgba(245, 235, 220, 0.95);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        #panel.open {
            transform: translateX(0);
        }

        #toggle-btn {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background-color: #8b5a2b;
            color: white;
            border: none;
            padding: 15px 10px;
            cursor: pointer;
            z-index: 1001;
            border-radius: 0 5px 5px 0;
            font-size: 20px;
            transition: left 0.3s ease;
        }

        #panel.open + #toggle-btn {
            left: 350px;
        }

        .panel-content {
            padding: 20px;
            overflow-y: auto;
            height: 100%;
            position: relative;
        }

        .panel-content h2 {
            margin-top: 0;
            color: #3e2723;
            border-bottom: 2px solid #8b5a2b;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: 1px solid #8b5a2b;
            color: #3e2723;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 16px;
            text-align: left;
            transition: background 0.2s;
        }
        
        .tab-btn:hover {
            background: #e0d0c0;
        }

        /* Кнопка перевода языков */
        #lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(245, 235, 220, 0.9);
            border: 1px solid #8b5a2b;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 16px;
            color: #3e2723;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-radius: 3px;
        }
        
        #lang-switch:hover {
            background: #fff;
        }

        /* Стили для окошка с текстом (УВЕЛИЧИЛИ) */
        .leaflet-popup-content {
            font-family: 'Georgia', serif;
            color: #3e2723;
            max-width: 450px; 
            font-size: 15px; 
        }

        .leaflet-popup-content h3 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #2c1a14;
        }
        
        .leaflet-popup-content p {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        /* Стили для картинки внутри окошка */
        .popup-image {
            width: 100%; 
            height: auto;
            border-radius: 4px;
            margin-bottom: 12px;
            border: 1px solid #8b5a2b;
        }

        /* АДАПТАЦИЯ ПОД ТЕЛЕФОНЫ (экран меньше 600px) */
        @media (max-width: 600px) {
            .leaflet-popup-content {
                max-width: 85vw; /* Плашечка занимает 85% ширины экрана телефона */
            }
            #panel {
                width: 85vw; /* Панель тоже становится шире на телефоне */
            }
            #panel.open + #toggle-btn {
                left: 85vw; /* Кнопка сдвигается вместе с панелью */
            }
        }

    </style>
</head>
<body>

    <!-- Кнопка смены языка -->
    <button id="lang-switch" onclick="toggleLanguage()">EN</button>

    <!-- Выезжающая панель -->
    <div id="panel">
        <div class="panel-content">
            <h2>Vivat-Pat</h2>
            <p id="panel-desc" style="font-size: 14px; color: #5d4037; margin-bottom: 20px;">Интерактивная карта шедевров Возрождения.</p>
            
            <h3 id="panel-sections">Разделы</h3>
            <button class="tab-btn" id="tab-countries">🏛️ Страны</button>
            <button class="tab-btn" id="tab-artists">👨‍🎨 Художники</button>
            
            <hr style="border: 1px solid #8b5a2b; margin: 20px 0;">
            
            <p style="font-size: 14px;">
                <span id="feedback-text">Есть идея для карты?</span><br>
                <a href="mailto:patyukhova@gmail.com?subject=Идея для Vivat-Pat" id="feedback-link" style="color: #8b5a2b;">✉️ Написать мне</a>
            </p>
        </div>
    </div>
    
    <button id="toggle-btn">☰</button>
    <div id="map"></div>

    <script>
        // Настройки карты
        var map = L.map('map', {
            minZoom: 5,
            maxZoom: 8,
            center: [45.0, 12.0], 
            zoom: 7,
            zoomControl: false 
        });

        // ТЕПЕРЬ ФАЙЛ WEBP
        var imageUrl = 'map.webp'; 
        var imageBounds = [[36.5, 5.0], [47.5, 20.0]]; 

        L.imageOverlay(imageUrl, imageBounds).addTo(map);

        // Ограничители краев
        var paddingBounds = [[35.0, 3.0], [49.0, 22.0]]; 
        map.setMaxBounds(paddingBounds);
        map.on('drag', function() {
            map.panInsideBounds(paddingBounds, { animate: false });
        });

        // Логика панели
        var panel = document.getElementById('panel');
        var toggleBtn = document.getElementById('toggle-btn');

        toggleBtn.addEventListener('click', function() {
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                toggleBtn.innerHTML = '✕';
            } else {
                toggleBtn.innerHTML = '☰';
            }
        });

        // Данные картин
        var artworks = [
            {
                title: { ru: "Юдифь", en: "Judith" },
                year: "ок. 1502",
                // Убрали Эрмитаж, оставили только город
                city: { ru: "Венеция", en: "Venice" }, 
                coords: [45.55, 11.75], // Сдвинули левее и выше
                author: { ru: "Джорджоне", en: "Giorgione" }, // Убрали слэш, теперь переключается
                image: "judith.jpg", 
                text: { 
                    ru: "«Юдифь» — картина итальянского живописца Джорджоне, представителя венецианской школы. Несмотря на то, что художник имел привычку не подписывать свои работы, она единодушно атрибутирована именно ему. Картина отсылает нас к Ветхозаветному сюжету Книги Юдифи.",
                    en: "Judith is a painting by the Italian artist Giorgione, a representative of the Venetian school. The painting refers to the Old Testament story of the Book of Judith."
                }
            }
        ];

        var currentLang = 'ru';

        // Функция для отрисовки точек
        function drawMarkers() {
            map.eachLayer(function (layer) {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });

            artworks.forEach(function(art) {
                var popupContent = `
                    <img src="${art.image}" class="popup-image" alt="${art.title[currentLang]}">
                    <h3>${art.title[currentLang]} (${art.year})</h3>
                    <p><strong>${currentLang === 'ru' ? 'Художник' : 'Artist'}:</strong> ${art.author[currentLang]}</p>
                    <p><strong>${currentLang === 'ru' ? 'Где находится' : 'Location'}:</strong> ${art.city[currentLang]}</p>
                    <p>${art.text[currentLang]}</p>
                `;

                var marker = L.marker(art.coords)
                    .addTo(map)
                    .bindPopup(popupContent, {
                        maxHeight: 500, 
                        autoPanPadding: [50, 50] 
                    });
            });
        }

        // Логика перевода
        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('panel-desc').innerText = currentLang === 'ru' ? 'Интерактивная карта шедевров Возрождения.' : 'Interactive map of Renaissance masterpieces.';
            document.getElementById('panel-sections').innerText = currentLang === 'ru' ? 'Разделы' : 'Sections';
            document.getElementById('tab-countries').innerText = currentLang === 'ru' ? '🏛️ Страны' : '🏛️ Countries';
            document.getElementById('tab-artists').innerText = currentLang === 'ru' ? '👨‍🎨 Художники' : '👨‍🎨 Artists';
            document.getElementById('feedback-text').innerText = currentLang === 'ru' ? 'Есть идея для карты?' : 'Have an idea for the map?';
            document.getElementById('feedback-link').innerText = currentLang === 'ru' ? '✉️ Написать мне' : '✉️ Write to me';

            drawMarkers();
        }

        drawMarkers();

    </script>
</body>
</html>
