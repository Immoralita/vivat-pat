<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест картинок</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.98); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #map { height: 100%; width: calc(100% - 350px); margin-left: 350px; z-index: 1; background-color: #e8dcc4; }
        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="panel">
        <h2>Тест 5 точек</h2>
        <p style="font-size: 14px; color: #5d4037;">Проверяем стандартные иконки.</p>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 10, center: [44.0, 10.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);

        var testImage = "map.webp";

        // Функция для создания точки со стандартной иконкой (без цветных картинок)
        function createTestMarker(coords, title) {
            return L.marker(coords).bindPopup(`<img src="${testImage}" style="width:100%; max-height:200px; object-fit:contain; margin-bottom:10px;"><h3>${title}</h3>`).addTo(map);
        }

        // 5 тестовых точек в разных местах
        createTestMarker([44.50, 9.00], "Тест 1 (Около Милана)");
        createTestMarker([44.00, 8.50], "Тест 2 (Монако/Генуя)");
        createTestMarker([44.50, 12.00], "Тест 3 (В море)");
        createTestMarker([43.00, 11.00], "Тест 4 (Тоскана)");
        createTestMarker([42.00, 13.00], "Тест 5 (Италия)");

    </script>
</body>
</html>
