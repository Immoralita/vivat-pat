<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка координат</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.98); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        #map { height: 100%; width: calc(100% - 350px); margin-left: 350px; z-index: 1; background-color: #e8dcc4; }
        
        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; }
        
        #mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #e8dcc4; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; font-family: 'Georgia', serif; color: #3e2723; }
        @media (max-width: 768px) {
            #panel, #map { display: none; }
            #mobile-overlay { display: flex; }
        }
    </style>
</head>
<body>

    <div id="mobile-overlay">
        <h2>Vivat-Pat</h2>
        <p>Откройте на компьютере.</p>
    </div>

    <div id="panel">
        <h2>Настройка координат</h2>
        <p style="font-size: 14px; color: #5d4037;">Настраиваем: <b>Рим (Афинская школа)</b> и добавляем <b>Пир в доме Левия</b>.</p>
        
        <button class="tab-btn" onclick="drawAll()" style="margin-top: 20px;">Показать все 10 точек</button>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 9, center: [45.0, 12.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);

        var milanCoords = [45.55, 9.75]; 
        var judithCoords = [45.55, 11.75];
        var venusCoords = [45.48, 11.68];
        var assuntaCoords = [45.62, 11.85];
        var mantuaCoords = [45.25, 10.70]; 
        var arezzoCoords = [43.80, 11.45]; 
        var venusBirthCoords = [44.05, 10.85]; 
        var monaLisaCoords = [44.05, 10.95]; 
        
        // НОВЫЕ КООРДИНАТЫ
        var romeCoords = [42.40, 11.90]; // Рим (выше и левее)
        var leviCoords = [45.55, 12.00]; // Пир в доме Левия (Венеция, чуть правее Юдифи)
        
        // Картинка для Рима (проверь название файла на GitHub!)
        var romeImage = "af.school.jpg"; 

        function createMarker(coords, color, title, img) {
            var markerIcon = new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-' + color + '.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            });
            var imageToShow = img ? img : "map.webp";
            return L.marker(coords, {icon: markerIcon}).bindPopup(`<img src="${imageToShow}" style="width:100%; max-height:200px; object-fit:contain; margin-bottom:10px;"><h3>${title}</h3>`);
        }

        function drawAll() {
            map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            
            // Венеция (3 + 1)
            createMarker(judithCoords, "blue", "Юдифь").addTo(map);
            createMarker(venusCoords, "blue", "Спящая Венера").addTo(map);
            createMarker(assuntaCoords, "blue", "Ассунта").addTo(map);
            createMarker(leviCoords, "blue", "Пир в доме Левия").addTo(map);
            
            // Флоренция / Ареццо
            createMarker(venusBirthCoords, "green", "Рождение Венеры").addTo(map);
            createMarker(monaLisaCoords, "green", "Мона Лиза").addTo(map);
            createMarker(arezzoCoords, "green", "Битва Константина").addTo(map);
            
            // Остальные
            createMarker(mantuaCoords, "violet", "Камера дельи Спози").addTo(map);
            createMarker(milanCoords, "yellow", "Тайная вечеря").addTo(map);
            createMarker(romeCoords, "pink", "Афинская школа", romeImage).addTo(map); // Передали картинку
        }

        drawAll();
    </script>
</body>
</html>
