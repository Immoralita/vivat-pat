<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivat-Pat | Карта Возрождения</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; background-color: #e8dcc4; }
        
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.95); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); transform: translateX(-100%); transition: transform 0.3s ease; }
        #panel.open { transform: translateX(0); }
        
        /* Кнопка поверх всего */
        #toggle-btn { position: absolute; top: 50%; left: 0; transform: translateY(-50%); background-color: #8b5a2b; color: white; border: none; padding: 15px 10px; cursor: pointer; z-index: 9999; border-radius: 0 5px 5px 0; font-size: 20px; transition: left 0.3s ease; }
        #panel.open + #toggle-btn { left: 350px; }

        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; transition: background 0.2s; }
        .tab-btn:hover { background: #e0d0c0; }
        
        #lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(245, 235, 220, 0.9); border: 1px solid #8b5a2b; padding: 8px 15px; cursor: pointer; font-size: 16px; font-family: 'Georgia', serif; color: #3e2723; }
        
        .leaflet-popup-content-wrapper { width: 700px !important; max-width: 90vw !important; }
        .leaflet-popup-content { font-family: 'Georgia', serif; color: #3e2723; width: 100% !important; margin: 0 !important; padding: 10px; font-size: 15px; }
        .leaflet-popup-content h3 { margin: 0 0 10px 0; font-size: 22px; color: #2c1a14; }
        .leaflet-popup-content p { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
        .leaflet-popup-content ul { padding-left: 20px; margin-bottom: 12px; }
        .leaflet-popup-content li { margin-bottom: 5px; line-height: 1.4; }
        .popup-image { width: 100%; height: auto; max-height: 400px; object-fit: contain; border-radius: 4px; margin-bottom: 12px; border: 1px solid #8b5a2b; }
        
        .footnote { border-bottom: 1px dotted #8b5a2b; cursor: help; position: relative; color: #5d4037; font-weight: bold; }
        .footnote:hover::after { content: attr(data-text); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #3e2723; color: white; padding: 15px; border-radius: 6px; font-size: 14px; width: 350px; max-width: 80vw; z-index: 2000; line-height: 1.4; pointer-events: none; font-weight: normal; text-align: left; display: block; white-space: normal; box-shadow: 0 4px 10px rgba(0,0,0,0.3); word-wrap: break-word; }
        
        .special-footnote-box { margin-top: 15px; padding: 15px; background-color: rgba(139, 90, 43, 0.05); border-top: 2px solid #8b5a2b; border-bottom: 2px solid #8b5a2b; font-size: 14px; line-height: 1.5; }
        .special-footnote-box h4 { margin: 0 0 10px 0; font-size: 16px; color: #3e2723; }
        
        .audio-wrapper { margin-top: 15px; padding-top: 10px; border-top: 1px solid #8b5a2b; }
        audio { width: 100%; margin-top: 5px; }

        @media (max-width: 768px) {
            #panel { width: 100%; height: 60vh; top: auto; bottom: 0; transform: translateY(100%); border-radius: 20px 20px 0 0; padding: 15px; }
            #panel.open { transform: translateY(0); }
            #toggle-btn { top: auto; bottom: 20px; left: 20px; transform: none; border-radius: 50%; padding: 15px 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
            #panel.open + #toggle-btn { left: 20px; bottom: 62vh; }
            .leaflet-popup-content-wrapper { width: 95vw !important; max-width: 95vw !important; }
            .leaflet-popup-content { max-height: 70vh; overflow-y: auto; overflow-x: hidden; padding: 10px !important; }
            .leaflet-popup-content p, .leaflet-popup-content li { font-size: 14px; }
            .footnote:hover::after { width: 250px; left: 50%; transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <button id="lang-switch" onclick="toggleLanguage()">EN</button>

    <div id="panel">
        <h2 id="site-title">Vivat-Pat</h2>
        <p id="panel-desc" style="font-size: 14px; color: #5d4037; margin-bottom: 20px;">Интерактивная карта шедевров Возрождения.</p>
        
        <button class="tab-btn" onclick="toggleMenu()" id="btn-countries">🏛️ Страны</button>
        <div id="country-list" style="display: none; margin-top: 10px;">
            <button class="tab-btn" onclick="switchCountry('italy')" id="btn-italy">Италия</button>
            <div style="padding-left: 15px; margin-bottom: 5px;">
                <button class="tab-btn" onclick="showEra()" id="btn-renaissance" style="font-size: 14px;">Высокое Возрождение</button>
                <div id="era-info-box" style="display: none; font-size: 13px; color: #5d4037; padding: 10px; border-left: 2px solid #8b5a2b; margin-bottom: 10px;"></div>
            </div>
            <button class="tab-btn" onclick="switchCountry('france')" id="btn-france">Франция</button>
        </div>
        
        <hr style="border: 1px solid #8b5a2b; margin: 20px 0;">
        <p style="font-size: 14px;">
            <span id="feedback-text">Есть идея для карты?</span><br>
            <a href="mailto:patyukhova@gmail.com" id="feedback-link" style="color: #8b5a2b;">✉️ Написать мне</a>
        </p>
    </div>
    
    <button id="toggle-btn" onclick="togglePanel()">☰</button>
    <div id="map"></div>

    <script>
        // Инициализация карты
        var map = L.map('map', { minZoom: 5, maxZoom: 8, center: [45.0, 12.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);
        var franceLayer = L.imageOverlay('map_france.webp', [[42.0, -5.0], [51.5, 8.5]]);

        var currentLang = 'ru';
        var currentCountry = 'italy';

        // Открытие/закрытие панели
        function togglePanel() {
            var panel = document.getElementById('panel');
            var btn = document.getElementById('toggle-btn');
            if (panel.style.transform === 'translateX(0px)' || panel.style.transform === 'translateY(0px)') {
                if(window.innerWidth > 768) panel.style.transform = 'translateX(-100%)';
                else panel.style.transform = 'translateY(100%)';
                btn.innerHTML = '☰';
            } else {
                panel.style.transform = 'translateX(0)';
                btn.innerHTML = '✕';
                if(window.innerWidth > 768) btn.style.left = '350px';
                else btn.style.bottom = '62vh';
            }
        }

        // Меню стран
        function toggleMenu() {
            var list = document.getElementById('country-list');
            if(list.style.display === 'none') list.style.display = 'block';
            else list.style.display = 'none';
        }

        // Эпоха
        function showEra() {
            if (currentCountry !== 'italy') {
                switchCountry('italy');
            }
            var box = document.getElementById('era-info-box');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                box.innerHTML = "**Высокое Возрождение**<br>**Годы: конец XV – начало XVI века (около 1490–1520).**<br>Период наивысшего расцвета ренессансного искусства, достигшего идеальной гармонии и монументальной величавости.<ul><li>Композиции отличаются строгой уравновешенностью, симметрией и ясностью.</li><li>Художники достигают совершенства в передаче человеческого тела и реалистичности образов.</li><li>Искусство приобретает героический и торжественный характер, прославляя величие человека.</li><li>Техника живописи совершенствуется, в частности, за счёт использования масляных красок и лессировок для глубины цвета.</li></ul>".replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                drawMarkers('italy');
            } else {
                box.style.display = 'none';
                map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            }
        }

        // Переключение стран
        function switchCountry(country) {
            currentCountry = country;
            if (country === 'france') {
                map.removeLayer(italyLayer);
                franceLayer.addTo(map);
                map.setView([46.5, 2.0], 6);
                map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
                document.getElementById('era-info-box').style.display = 'none';
            } else {
                if(map.hasLayer(franceLayer)) map.removeLayer(franceLayer);
                italyLayer.addTo(map);
                map.setView([45.0, 12.0], 7);
                document.getElementById('era-info-box').style.display = 'none';
                map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            }
        }

        // Отрисовка маркера
        function drawMarkers(country) {
            map.eachLayer(function (layer) {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });

            if (country === 'italy') {
                var coords = [45.55, 11.75];
                var image = "judith.jpg";
                var popupContent = `
                    <img src="${image}" class="popup-image">
                    <h3>Юдифь (1504-1506 гг.)</h3>
                    <p><strong>Художник:</strong> Джорджоне</p>
                    <p><strong>Место создания:</strong> Венеция</p>
                    <p><strong>Место хранения:</strong> Эрмитаж</p>
                    <p>Текст про картину...</p>
                    <audio controls><source src="vivaldi.mp3" type="audio/mpeg"></audio>
                `;
                L.marker(coords).addTo(map).bindPopup(popupContent, { maxHeight: 600 });
            }
        }

        // Смена языка (упрощенно)
        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
        }

        // Запуск при загрузке
        window.onload = function() {
            drawMarkers('italy');
        };
    </script>
</body>
</html>
