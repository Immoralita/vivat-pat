<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivat-Pat | Карта Возрождения</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.98); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        #map { height: 100%; width: calc(100% - 350px); margin-left: 350px; z-index: 1; background-color: #e8dcc4; }
        
        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; transition: background 0.2s; }
        .tab-btn:hover { background: #e0d0c0; }
        
        #lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(245, 235, 220, 0.9); border: 1px solid #8b5a2b; padding: 8px 15px; cursor: pointer; font-size: 16px; font-family: 'Georgia', serif; color: #3e2723; }
        
        .leaflet-popup-content-wrapper { width: 700px !important; max-width: 90vw !important; }
        .leaflet-popup-content { font-family: 'Georgia', serif; color: #3e2723; width: 100% !important; margin: 0 !important; padding: 10px; font-size: 15px; }
        .leaflet-popup-content h3 { margin: 0 0 10px 0; font-size: 22px; color: #2c1a14; }
        .leaflet-popup-content p { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
        .popup-image { width: 100%; height: auto; max-height: 400px; object-fit: contain; border-radius: 4px; margin-bottom: 12px; border: 1px solid #8b5a2b; }
        
        #mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #e8dcc4; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; font-family: 'Georgia', serif; color: #3e2723; }
        #mobile-overlay h2 { font-size: 28px; margin-bottom: 20px; color: #8b5a2b; }
        .mobile-text-block { font-size: 15px; line-height: 1.5; margin-bottom: 15px; }
        .mobile-divider { width: 80%; border-top: 1px solid #8b5a2b; margin: 15px 0; opacity: 0.5; }
        .mobile-link-box { background: rgba(139, 90, 43, 0.1); padding: 15px; border-radius: 5px; border: 1px dashed #8b5a2b; word-break: break-all; font-weight: bold; font-size: 14px; margin-top: 15px; width: 90%; }

        @media (max-width: 768px) {
            #panel, #map, #lang-switch { display: none; }
            #mobile-overlay { display: flex; }
        }

        .bio-text { font-size: 14px; line-height: 1.5; margin-bottom: 15px; }
        .work-link { cursor: pointer; color: #8b5a2b; text-decoration: underline; font-weight: bold; display: block; margin-bottom: 5px; }
        .work-link:hover { color: #d35400; }
        
        .artist-btn { border: none; border-bottom: 1px solid #ccc; background: #f9f4ec; width: 100%; text-align: left; padding: 8px; cursor: pointer; font-family: 'Georgia', serif; color: #8b5a2b; font-weight: bold; }
        .artist-btn:hover { background: #e0d0c0; }
    </style>
</head>
<body>

    <div id="mobile-overlay">
        <h2>Vivat-Pat</h2>
        <div class="mobile-text-block"><strong>RU:</strong> Для комфортного просмотра откройте сайт на компьютере.</div>
        <div class="mobile-text-block"><strong>EN:</strong> For a comfortable viewing, open the site on a computer.</div>
        <div class="mobile-divider"></div>
        <div class="mobile-text-block" style="font-size: 14px;">Скопируйте ссылку:<br><em>Copy the link:</em></div>
        <div class="mobile-link-box">https://immoralita.github.io/vivat-pat/</div>
    </div>

    <div id="panel">
        <h2 id="site-title">Vivat-Pat</h2>
        
        <div id="main-menu">
            <button class="tab-btn" onclick="showCountries()" id="btn-countries">🏛️ Страны</button>
            <button class="tab-btn" onclick="showSchools()" id="btn-schools">👨‍🎨 Художники</button>
        </div>

        <!-- Меню стран -->
        <div id="country-list" style="display: none; margin-top: 10px;">
            <button class="tab-btn" onclick="switchCountry('italy')" id="btn-italy">Италия</button>
            <div style="padding-left: 15px; margin-bottom: 5px;">
                <button class="tab-btn" onclick="showEraInfo('early')" id="btn-early" style="font-size: 14px;">Раннее Возрождение</button>
                <button class="tab-btn" onclick="showEraInfo('high')" id="btn-high" style="font-size: 14px;">Высокое Возрождение</button>
                <button class="tab-btn" onclick="showEraInfo('late')" id="btn-late" style="font-size: 14px;">Позднее Возрождение</button>
                <div id="era-info-box" style="display: none; font-size: 13px; color: #5d4037; padding: 10px; border-left: 2px solid #8b5a2b; margin-bottom: 10px;"></div>
            </div>
            <button class="tab-btn" onclick="switchCountry('france')" id="btn-france">Франция</button>
        </div>

        <!-- Меню художников -->
        <div id="schools-list" style="display: none; margin-top: 10px;">
            <button class="tab-btn" onclick="showSchoolInfo('venetian')" id="btn-venetian" style="font-size: 14px;">Венецианская школа</button>
            <div id="venetian-artists" style="display: none; margin-bottom: 10px;">
                <!-- Кнопка Джорджоне -->
                <button class="artist-btn" onclick="showArtist('giorgione')">Джорджоне</button>
            </div>
            
            <button class="tab-btn" onclick="showSchoolInfo('florentine')" id="btn-florentine" style="font-size: 14px;">Флорентийская школа</button>
            <div id="florentine-artists" style="display: none; margin-bottom: 10px;">
                <!-- Кнопка Боттичелли -->
                <button class="artist-btn" onclick="showArtist('botticelli')">Боттичелли</button>
            </div>
            
            <button class="tab-btn" onclick="showSchoolInfo('paduan')" id="btn-paduan" style="font-size: 14px;">Падуанская школа</button>
            <button class="tab-btn" onclick="showSchoolInfo('umbrian')" id="btn-umbrian" style="font-size: 14px;">Умбрийская школа</button>
            <button class="tab-btn" onclick="showSchoolInfo('roman')" id="btn-roman" style="font-size: 14px;">Римская школа</button>
        </div>

        <div id="info-screen" style="display: none; margin-top: 15px;">
            <button class="tab-btn" onclick="closeInfoScreen()" style="background: #e0d0c0; text-align: center; font-weight: bold;">← Назад</button>
            <h3 id="info-title" style="color: #8b5a2b; margin-top: 15px;"></h3>
            <div id="info-content" style="font-size: 14px; line-height: 1.5;"></div>
        </div>

        <hr style="border: 1px solid #8b5a2b; margin: 20px 0;">
        <p style="font-size: 14px;">
            <span id="feedback-text">Есть идея для карты?</span><br>
            <a href="mailto:patyukhova@gmail.com?subject=Идея для Vivat-Pat" id="feedback-link" style="color: #8b5a2b;">✉️ Написать мне</a>
        </p>
    </div>
    
    <button id="lang-switch" onclick="toggleLanguage()">EN</button>
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 8, center: [45.0, 12.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);
        var franceLayer = L.imageOverlay('map_france.webp', [[42.0, -5.0], [51.5, 8.5]]);

        var currentLang = 'ru';
        var currentCountry = 'italy';

        var schools = {
            venetian: {
                title: { ru: "Венецианская школа", en: "Venetian School" },
                text: {
                    ru: "Венецианская школа (XIV–XVIII века, расцвет — XV–XVI века).<br><br>Ранний основатель: Паоло Венециано. Значимые художники: Джорджоне, Тициан, Паоло Веронезе, Якопо Тинторетто, семья Беллини.<br><br>Особенные черты:<br>• Приоритет колорита над рисунком.<br>• Гармония человека и природы.<br>• Праздничная зрелищность и декоративность.<br>• Интерес к повседневной жизни.<br>• Влияние нидерландской техники.<br><br>Интересный факт: Школа дала миру не только Тициана и Веронезе, но и мастеров XVIII века — Тьеполо, Каналетто и Гварди.",
                    en: "The Venetian School (14th–18th centuries, heyday — 15th–16th centuries).<br><br>Early founder: Paolo Veneziano. Significant artists: Giorgione, Titian, Paolo Veronese, Jacopo Tintoretto, the Bellini family.<br><br>Distinctive features:<br>• The primacy of colour over drawing.<br>• Harmony between man and nature.<br>• Festive spectacle and decorative richness.<br>• Interest in everyday life.<br>• The influence of Netherlandish technique.<br><br>Interesting fact: The school gave the world not only Titian and Veronese, but also 18th-century masters — Tiepolo, Canaletto and Guardi."
                }
            },
            florentine: {
                title: { ru: "Флорентийская школа", en: "Florentine School" },
                text: {
                    ru: "Флорентийская школа (XIII–XVI века, расцвет — XV — начало XVI века).<br><br>Значимые художники: Джотто, Мазаччо, Боттичелли, Леонардо да Винчи, Микеланджело.<br><br>Особенные черты:<br>• Приоритет рисунка и пластической формы над колоритом.<br>• Научный подход к перспективе и анатомии.<br>• Светотеневая моделировка объёма.<br>• Повествовательная выразительность и драматизм.<br><br>Интересный факт: Микеланджело в возрасте около 15 лет копировал фрески Джотто и Мазаччо во Флоренции.",
                    en: "The Florentine School (13th–16th centuries, heyday — 15th — early 16th centuries).<br><br>Significant artists: Giotto, Masaccio, Botticelli, Leonardo da Vinci, Michelangelo.<br><br>Distinctive features:<br>• The primacy of drawing and plastic form over colour.<br>• A scientific approach to perspective and anatomy.<br>• Chiaroscuro modelling of volume.<br>• Narrative expressiveness and drama.<br><br>Interesting fact: At about the age of 15, Michelangelo copied the frescoes of Giotto and Masaccio in Florence."
                }
            },
            paduan: { title: { ru: "Падуанская школа", en: "Paduan School" }, text: { ru: "Основатель: Франческо Скварчоне. Значимые художники: Андреа Мантенья и др.", en: "Founder: Francesco Squarcione. Significant artists: Andrea Mantegna and others." } },
            umbrian: { title: { ru: "Умбрийская школа", en: "Umbrian School" }, text: { ru: "Значимые художники: Пьетро Перуджино, Пинтуриккьо, ранний Рафаэль.", en: "Significant artists: Pietro Perugino, Pinturicchio, early Raphael." } },
            roman: { title: { ru: "Римская школа", en: "Roman School" }, text: { ru: "Основатель: Рафаэль Санти. Значимые художники: Джулио Романо и др.", en: "Founder: Raphael Sanzio. Significant artists: Giulio Romano and others." } }
        };

        var artists = {
            giorgione: {
                school: 'venetian',
                title: { ru: "Джорджоне", en: "Giorgione" },
                bio: {
                    ru: "Джорджоне (настоящее имя Джорджо Барбарелли да Кастельфранко) жил примерно с 1477 по 1510 год. Умер от чумы в возрасте 32–33 лет, поэтому достоверных сведений о его жизни сохранилось немного. Он писал в основном камерные картины на религиозные, мифологические и аллегорические сюжеты, среди самых известных работ — «Спящая Венера» и «Гроза». Джорджоне считается одним из первых мастеров Высокого Возрождения в Венеции, его подход к цвету и свету повлиял на последующих художников, включая Тициана.",
                    en: "Giorgione (real name Giorgio Barbarelli da Castelfranco) lived from approximately 1477 to 1510 and was a painter of the Venetian school. He died of the plague at around age 32–33, so very little reliable information about his life survived. He mainly painted intimate works on religious, mythological, and allegorical subjects, with the «Sleeping Venus» and «The Tempest» among his best-known pieces. Giorgione is regarded as one of the first masters of the High Renaissance in Venice. His approach to color and light influenced later artists, including Titian."
                },
                works: [ { title: { ru: "Юдифь", en: "Judith" }, id: "judith" }, { title: { ru: "Спящая Венера", en: "Sleeping Venus" }, id: "venus" } ]
            },
            botticelli: {
                school: 'florentine',
                title: { ru: "Сандро Боттичелли", en: "Sandro Botticelli" },
                bio: { ru: "Итальянский живописец, представитель флорентийской школы.", en: "Italian painter, representative of the Florentine school." },
                works: [ { title: { ru: "Рождение Венеры", en: "Birth of Venus" }, id: "venus_birth" } ]
            }
        };

        var artworks = [
            {
                id: "judith", country: "italy", era: "high", artist: "giorgione",
                title: { ru: "Юдифь", en: "Judith" }, year: "1504-1506 гг.",
                city: { ru: "Венеция", en: "Venice" }, museum: { ru: "Эрмитаж", en: "Hermitage" },
                coords: [45.55, 11.75], image: "judith.jpg", audio: "vivaldi.mp3",
                text: { ru: "Короткий текст для теста.", en: "Short text for test." }
            },
            {
                id: "venus", country: "italy", era: "high", artist: "giorgione",
                title: { ru: "Спящая Венера", en: "Sleeping Venus" }, year: "ок. 1510",
                city: { ru: "Венеция", en: "Venice" }, museum: { ru: "Галерея старых мастеров, Дрезден", en: "Old Masters Gallery, Dresden" },
                coords: [45.50, 11.80], image: "venere.jpg", 
                text: { ru: "«Спящая Венера» — картина Джорджоне...", en: "The Sleeping Venus is a painting by Giorgione..." }
            },
            {
                id: "venus_birth", country: "italy", era: "early", artist: "botticelli",
                title: { ru: "Рождение Венеры", en: "Birth of Venus" }, year: "ок. 1485",
                city: { ru: "Флоренция", en: "Florence" }, museum: { ru: "Галерея Уффици", en: "Uffizi Gallery" },
                coords: [44.05, 10.85], image: "judith.jpg", 
                text: { ru: "Тест.", en: "Test." }
            }
        ];

        function hideAll() {
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('country-list').style.display = 'none';
            document.getElementById('schools-list').style.display = 'none';
            document.getElementById('info-screen').style.display = 'none';
            document.getElementById('era-info-box').style.display = 'none';
            document.getElementById('venetian-artists').style.display = 'none';
            document.getElementById('florentine-artists').style.display = 'none';
        }

        function ensureItaly() {
            if (currentCountry !== 'italy') {
                if(map.hasLayer(franceLayer)) map.removeLayer(franceLayer);
                italyLayer.addTo(map);
                map.setView([45.0, 12.0], 7);
                currentCountry = 'italy';
            }
        }

        function showCountries() {
            hideAll();
            document.getElementById('country-list').style.display = 'block';
            ensureItaly();
            drawMarkers('italy', 'all');
        }

        function showSchools() {
            hideAll();
            document.getElementById('schools-list').style.display = 'block';
            map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            ensureItaly();
        }

        function showSchoolInfo(schoolId) {
            hideAll();
            document.getElementById('schools-list').style.display = 'block'; // Оставляем меню видимым
            var school = schools[schoolId];
            
            // Вставляем инфу прямо в список (или в отдельный блок)
            var infoScreen = document.getElementById('info-screen');
            infoScreen.style.display = 'block';
            document.getElementById('info-title').innerHTML = school.title[currentLang];
            
            // Формируем контент
            var content = processText(school.text[currentLang]);
            
            // Добавляем художников ПОД текстом школы
            if (schoolId === 'venetian') {
                content += `<h4 style="margin-top: 15px; color: #8b5a2b;">Художники:</h4>`;
                content += `<button class="artist-btn" onclick="showArtist('giorgione')">Джорджоне</button>`;
            }
            if (schoolId === 'florentine') {
                content += `<h4 style="margin-top: 15px; color: #8b5a2b;">Художники:</h4>`;
                content += `<button class="artist-btn" onclick="showArtist('botticelli')">Боттичелли</button>`;
            }

            document.getElementById('info-content').innerHTML = content;
            ensureItaly();
        }

        function showArtist(artistId) {
            hideAll();
            document.getElementById('schools-list').style.display = 'block';
            var artist = artists[artistId];
            document.getElementById('info-screen').style.display = 'block';
            document.getElementById('info-title').innerHTML = artist.title[currentLang];
            
            var content = `<div class="bio-text">${processText(artist.bio[currentLang])}</div>`;
            content += `<h4>Работы / Works:</h4>`;
            artist.works.forEach(function(work) {
                content += `<span class="work-link" onclick="focusOnWork('${work.id}')">${work.title[currentLang]}</span>`;
            });
            
            document.getElementById('info-content').innerHTML = content;
            ensureItaly();
            drawMarkers('italy', 'all', artistId); 
        }

        function focusOnWork(workId) {
            var art = artworks.find(a => a.id === workId);
            if (art) {
                map.setView(art.coords, 8); 
            }
        }

        function closeInfoScreen() {
            hideAll();
            ensureItaly();
            drawMarkers('italy', 'all');
        }

        function showEraInfo(era) {
            hideAll();
            document.getElementById('country-list').style.display = 'block';
            var box = document.getElementById('era-info-box');
            box.style.display = 'block';
            box.innerHTML = "Текст эпохи " + era; 
            ensureItaly();
            drawMarkers('italy', era);
        }

        function switchCountry(country) {
            hideAll();
            document.getElementById('country-list').style.display = 'block';
            currentCountry = country;
            if (country === 'france') {
                map.removeLayer(italyLayer); franceLayer.addTo(map); map.setView([46.5, 2.0], 6);
                map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            } else {
                ensureItaly();
                drawMarkers('italy', 'all');
            }
        }

        function processText(text) {
            if(!text) return '';
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function drawMarkers(country, era = 'all', artistId = 'all') {
            map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });

            artworks.forEach(function(art) {
                if (art.country !== country) return;
                if (era !== 'all' && art.era !== era) return;
                if (artistId !== 'all' && art.artist !== artistId) return;

                var popupContent = `
                    <img src="${art.image}" class="popup-image" alt="${art.title[currentLang]}">
                    <h3>${art.title[currentLang]} (${art.year})</h3>
                    <p><strong>${currentLang === 'ru' ? 'Художник' : 'Artist'}:</strong> ${artists[art.artist].title[currentLang]}</p>
                    <p><strong>${currentLang === 'ru' ? 'Место создания' : 'Place of creation'}:</strong> ${art.city[currentLang]}</p>
                    <p><strong>${currentLang === 'ru' ? 'Место хранения' : 'Current location'}:</strong> ${art.museum[currentLang]}</p>
                    <p>${processText(art.text[currentLang])}</p>
                `;

                L.marker(art.coords).addTo(map).bindPopup(popupContent, { maxHeight: 600 });
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('btn-countries').innerText = currentLang === 'ru' ? '🏛️ Страны' : '🏛️ Countries';
            document.getElementById('btn-schools').innerText = currentLang === 'ru' ? '👨‍🎨 Художники' : '👨‍🎨 Artists';
            hideAll();
            ensureItaly();
            drawMarkers('italy', 'all');
        }

        drawMarkers('italy', 'all');
    </script>
</body>
</html>
