                coords: [45.55, 9.75], image: "vechera.jpg", audio: "holst.mp3", color: "yellow", 
                                text: { 
                    ru: "«Тайная вечеря» — монументальная роспись итальянского живописца Леонардо да Винчи, представителя флорентийской школы, созданная в Милане в 1495–1498 годах. Это не картина в привычном смысле, а роспись по сухой штукатурке, что и предопределило её судьбу, размером примерно 460 × 880 см. Находится в трапезной монастыря Санта-Мария-делле-Грацие в Милане. Заказчиком выступил герцог Лудовико Сфорца, известный как Лудовико Моро, — он хотел, чтобы роспись стала частью фамильного некрополя и прославила его династию.<br><br>Сюжет — момент, описанный во всех четырёх Евангелиях: Христос и двенадцать апостолов за пасхальной трапезой. Но Леонардо выбирает не момент установления таинства причастия, как это было принято у художников XV века, а слова Христа: «Один из вас предаст Меня». Именно эта фраза запускает ту самую бурю эмоций, которую мы видим на росписи. Апостолы разбиты на четыре группы по три человека — и в этой разбивке уже есть логика, которую исследователи расшифровывают столетиями.<br><br>В центре — Христос. Он не сидит с краю, как на более ранних «Тайных вечерях», а находится ровно посередине, образуя своим телом устойчивый треугольник. Его руки разведены: правая лежит на столе ладонью вверх (жест принятия), левая тоже повёрнута ладонью вверх — но в сторону хлеба и вина. Его лицо спокойно, в отличие от лиц апостолов, и это спокойствие — главный контраст росписи.<br><br>Справа от Христа (для зрителя — слева) — группа из трёх фигур: Иоанн, Пётр и Иуда. Это самая напряжённая часть композиции. Иоанн, молодой и безбородый, склонился к Христу и сложил руки — его часто принимают за женщину, и это породило одну из самых живучих теорий заговора. Пётр, наоборот, подался вперёд, его лицо искажено гневом, а в руке — нож. Иуда сидит ниже всех, откинувшись назад, и его голова находится на уровне груди Христа — композиционный приём, который визуально «выталкивает» его из группы. В правой руке он сжимает мешочек с тридцатью сребрениками, а левой опрокидывает солонку.<br><br>О деньгах стоит сказать отдельно. В Ветхом Завете тридцать сребреников — это стоимость раба (Исход 21:32). То есть Иуда продал Христа по цене раба. При этом интересно, что Иуда, который был казначеем, не стал торговаться. Он спросил: «Что вы дадите мне?» — и принял первое предложение. Некоторые исследователи видят в этом не жадность, а жест отчаяния или даже презрения.<br><br>Дальше от Христа, за Иудой, — Андрей и Иаков Младший. Андрей поднял обе руки, словно пытаясь остановить происходящее. Иаков Младший касается плеча Петра. Эта группа — как бы «внешнее кольцо» сцены: они уже поняли, что происходит, но ещё не знают, кто именно предатель.<br><br>Слева от Христа (для зрителя — справа) — Варфоломей, Иаков Старший и Филипп. Варфоломей встал и опирается обеими руками на стол. Иаков Старший смотрит на Варфоломея. Филипп, в жёлтом плаще, поднял руки к груди — жест, означающий «я не виноват».<br><br>Дальше, у самого края слева, — Матфей, Фаддей и Симон Зилот. Матфей повернулся к Фаддею. Фаддей смотрит на Христа. Симон Зилот, старик с бородой, замыкает композицию.<br><br>И ещё один апостол — Фома. Он сидит сразу за Иаковом Старшим, у самого Христа. Его жест — указательный палец, поднятый вверх, — стал предметом отдельной теории. Фома, известный как «неверующий», здесь поднимает палец, словно уже задаёт вопрос или готовится к сомнению.<br><br>Существует популярная легенда, что Леонардо писал Христа с молодого певчего, а для Иуды искал натурщика годами, пока не нашёл в тюрьме преступника. Эта история красива, но документально не подтверждена.<br><br>«Тайная вечеря» начала разрушаться ещё при жизни Леонардо. Он писал не по свежей штукатурке, как требовала традиционная техника фрески, а по сухой стене, экспериментируя с масляными красками. Уже в 1517 году очевидцы отмечали, что роспись осыпается. То, что мы видим сегодня, — результат многолетней реставрации.",
                    en: "«The Last Supper» is a monumental mural by the Italian painter Leonardo da Vinci, a representative of the Florentine school, created in Milan in 1495–1498. It is not a painting in the usual sense but a mural on dry plaster, which predetermined its fate, measuring approximately 460 × 880 cm. It is located in the refectory of the monastery of Santa Maria delle Grazie in Milan. The commission came from Duke Ludovico Sforza, known as Ludovico il Moro — he wanted the mural to become part of the family necropolis and to glorify his dynasty.<br><br>The subject is the moment described in all four Gospels: Christ and the twelve apostles at the Passover meal. But Leonardo chooses not the moment of the institution of the sacrament of Communion, as was usual for 15th-century artists, but Christ's words: «One of you will betray me». It is this phrase that sets off the very storm of emotions that we see in the mural. The apostles are divided into four groups of three — and in this division there is already a logic that researchers have been deciphering for centuries.<br><br>In the centre is Christ. He does not sit at the edge, as in earlier «Last Suppers», but is exactly in the middle, forming a stable triangle with his body. His arms are spread: the right lies on the table palm up (a gesture of acceptance), the left is also turned palm up — but towards the bread and wine. His face is calm, unlike the faces of the apostles, and this calm is the main contrast of the mural.<br><br>To the right of Christ (for the viewer — on the left) is a group of three figures: John, Peter and Judas. This is the most tense part of the composition. John, young and beardless, has leaned towards Christ and folded his hands — he is often mistaken for a woman, and this gave rise to one of the most persistent conspiracy theories. Peter, on the contrary, has leaned forward, his face is distorted with anger, and in his hand is a knife. Judas sits lower than everyone, leaning back, and his head is at the level of Christ's chest — a compositional device that visually «pushes» him out of the group. In his right hand he clutches a bag with thirty pieces of silver, and with his left he knocks over the salt cellar.<br><br>Money should be mentioned separately. In the Old Testament, thirty pieces of silver is the value of a slave (Exodus 21:32). That is, Judas sold Christ at the price of a slave. It is interesting that Judas, who was the treasurer, did not bargain. He asked: «What will you give me?» — and accepted the first offer. Some researchers see in this not greed but a gesture of despair or even contempt.<br><br>Further from Christ, behind Judas, are Andrew and James the Less. Andrew has raised both hands, as if trying to stop what is happening. James the Less touches Peter's shoulder. This group is like the «outer ring» of the scene: they have already understood that something is happening, but they do not yet know who exactly the traitor is.<br><br>To the left of Christ (for the viewer — on the right) are Bartholomew, James the Greater and Philip. Bartholomew has stood up and leans on the table with both hands. James the Greater looks at Bartholomew. Philip, in a yellow cloak, has raised his hands to his chest — a gesture meaning «I am not guilty».<br><br>Further, at the very edge on the left, are Matthew, Thaddeus and Simon the Zealot. Matthew has turned to Thaddeus. Thaddeus looks at Christ. Simon the Zealot, an old man with a beard, closes the composition.<br><br>And one more apostle — Thomas. He sits right behind James the Greater, next to Christ. His gesture — an index finger raised upwards — has become the subject of a separate theory. Thomas, known as «doubting», raises his finger here as if already asking a question or preparing for doubt.<br><br>There is a popular legend that Leonardo painted Christ from a young singer, and for Judas he searched for a model for years until he found a criminal in prison. This story is beautiful but not documented.<br><br>«The Last Supper» began to deteriorate during Leonardo's lifetime. He painted not on fresh plaster, as the traditional fresco technique required, but on a dry wall, experimenting with oil paints. Already in 1517 eyewitnesses noted that the mural was crumbling. What we see today is the result of many years of restoration."

                    ru: "«Афинская школа» — фреска итальянского живописца Рафаэля Санти (Раффаэлло Санцио), представителя Высокого Возрождения. Написана около 1509–1511 годов, размеры — примерно 500 × 770 см. Находится в Ватикане, в Станце делла Сеньятура (Stanza della Segnatura) — комнате папского дворца, которая, вероятно, служила библиотекой папы Юлия II. Название «Афинская школа» придумал не Рафаэль: оно закрепилось за фреской уже после его смерти.<br><br>Заказ поступил от папы Юлия II, который в 1508 году пригласил молодого Рафаэля в Рим для росписи своих личных покоев. Рафаэлю было около двадцати пяти лет, и это был его первый крупный римский заказ. Работа в Станце делла Сеньятура шла параллельно с росписью потолка Сикстинской капеллы Микеланджело, и два художника, по сути, соревновались за внимание папы и Рима. Программа росписи комнаты выстроена вокруг четырёх областей знания: теологии, философии, юриспруденции и поэзии. «Афинская школа» представляет философию, а на противоположной стене находится «Диспута» — сцена, посвящённая теологии. Композиционно они противопоставлены: там церковь торжествующая, здесь — человеческий разум в поиске истины.<br><br>В центре фрески, в точке схода перспективы, идут двое — Платон и Аристотель. Платон, старый, седой, босой, держит в левой руке «Тимей», а правой указывает вверх. Аристотель, моложе, в богатых одеждах и обуви, держит «Никомахову этику» и простирает правую руку вперёд, горизонтально, словно охватывая землю. Их жесты традиционно читаются как формула двух философий: Платон указывает на мир идей, Аристотель — на мир опыта. Но это не просто «идеализм против эмпиризма». Платон в «Тимее» описывал космос и его гармонию, а Аристотель в «Этике» настаивал, что знание должно быть практическим, а не созерцательным. Жест Платона — это не бегство от земли, а указание на источник порядка, который Аристотель ищет уже внутри самого мира. Они идут рядом, и в этом главная идея фрески: истина не принадлежит ни одному из них, она рождается из их спора.<br><br>Вокруг центральной пары Рафаэль собирает философов, математиков и астрономов — почти всех, кого можно было «опознать» по античным бюстам, текстам или традиции. Слева от Платона, в группе слушателей, стоит Сократ: его узнают по характерному лысому черепу и жесту, которым он, по-видимому, что-то доказывает собеседникам. Ниже, на ступенях, полулежит Диоген Синопский — в лохмотьях, с чашей в руке, воплощение кинического презрения к условностям; его поза и положение в композиции работают как «пауза» в общем движении, точка равнодушия к суете. В левом нижнем углу, у доски, сидит Пифагор. Он записывает схему музыкальных интервалов — ту самую гармонию чисел, которую Платон потом разовьёт в «Тимее» как гармонию космоса. На доске перед ним видна диаграмма, связанная с его учением о числах и музыкальных пропорциях. Некоторые исследователи отмечают, что Вазари, описывая фреску, принял Пифагора за евангелиста Матфея, диктующего текст, — настолько сильна была привычка видеть в подобных сценах христианские сюжеты.<br><br>Справа от Аристотеля — тоже группа учёных. Внизу, склонившись над табличкой с геометрическим чертежом, стоит человек с циркулем. Его обычно отождествляют с Евклидом (реже — с Архимедом), и вокруг него четверо юношей, жадно следящих за построением. Рядом, чуть выше, — Птолемей с земным глобусом в руке и другой астроном с глобусом небесным; их разговор — о двух системах, земной и небесной, которые ещё предстоит согласовать. В самом углу, у края фрески, Рафаэль поместил себя: молодой человек в чёрном берете смотрит прямо на зрителя. Это не скромная подпись, а жест: художник встаёт в один ряд с философами, потому что живопись для Рафаэля — тоже способ познания.<br><br>Архитектура, в которой происходит действие, — не просто фон. Это величественный vaulted интерьер с арками, кессонами и статуями Аполлона и Афины в нишах по сторонам. Считается, что Рафаэль работал над этим пространством вместе с архитектором Донато Брамане, и в перспективном построении отразились идеи Браманте о возрождении римской античности: мощь базилики Максенция и проект нового собора Святого Петра считываются в этих арках. Пространство фрески не «вмещает» фигуры, а организует их: оно задаёт иерархию и направление взгляда, ведёт от центра к периферии и обратно. В этом смысле «Афинская школа» — не просто групповой портрет философов, а визуальная модель знания: у него есть центр, есть спор, есть периферия, где знание становится ремеслом и инструментом.<br><br>Отдельная тема — отождествления фигур. Некоторые из них бесспорны: Платон, Аристотель, Сократ, Пифагор, Евклид, Птолемей, Диоген. Другие остаются предметом споров столетиями. Например, Гераклит, сидящий в одиночестве на переднем плане слева, написан с Микеланджело: угрюмый, задумчивый, облокотившийся на мраморный блок. Рафаэль, вероятно, видел его в Сикстинской капелле или знал о его работе там и вставил эту фигуру как своего рода оммаж сопернику — или как полемический жест: Микеланджело-Гераклит плачет о мире, в то время как другие строят его заново. Есть и версия, что Платон написан с Леонардо да Винчи: сходство профиля и бороды слишком заметно, чтобы быть случайным. Если это так, Рафаэль выстраивает генеалогию: Леонардо-Платон указывает вверх, Микеланджело-Гераклит погружён в себя, а сам Рафаэль стоит в углу и смотрит на зрителя — три поколения художников в одном пространстве.<br><br>Символически фреска читается как компендиум ренессансного представления о знании. Статуи Аполлона и Афины по сторонам зала напоминают, что философия не отменяет поэзию и мудрость, а соседствует с ними. Над всей сценой — небо, но не христианское небо, а небо античное, ясное и пустое. Именно поэтому «Афинская школа» так часто воспринимается как манифест гуманизма: человек здесь сам, без божественного вмешательства, ищет истину, и это искание изображено не как грех, а как величие. Рафаэль не противопоставляет Афины Иерусалиму — он ставит их рядом, на противоположные стены одной комнаты, и оставляет зрителю решать, где заканчивается одно и начинается другое.",
                    en: "«The School of Athens» is a fresco by the Italian painter Raphael Santi (Raffaello Sanzio), a representative of the High Renaissance. It was painted around 1509–1511, and its size is approximately 500 × 770 cm. It is located in the Vatican, in the Stanza della Segnatura — a room of the papal palace that probably served as the library of Pope Julius II. The name «The School of Athens» was not invented by Raphael: it became attached to the fresco after his death.<br><br>The commission came from Pope Julius II, who in 1508 invited the young Raphael to Rome to paint his private rooms. Raphael was about twenty-five years old, and this was his first major Roman commission. The work in the Stanza della Segnatura went on in parallel with Michelangelo's painting of the Sistine Chapel ceiling, and the two artists were, in essence, competing for the attention of the pope and of Rome. The programme of the room's decoration is built around four areas of knowledge: theology, philosophy, jurisprudence and poetry. «The School of Athens» represents philosophy, and on the opposite wall is the «Disputa» — a scene devoted to theology. Compositionally they are set against each other: there the Church triumphant, here human reason in search of truth.<br><br>In the centre of the fresco, at the vanishing point of the perspective, two men are walking — Plato and Aristotle. Plato, old, grey-haired, barefoot, holds the «Timaeus» in his left hand and points upwards with his right. Aristotle, younger, in rich clothes and shoes, holds the «Nicomachean Ethics» and extends his right hand forward, horizontally, as if embracing the earth. Their gestures are traditionally read as a formula of two philosophies: Plato points to the world of ideas, Aristotle to the world of experience. But this is not simply «idealism versus empiricism». Plato in the «Timaeus» described the cosmos and its harmony, while Aristotle in the «Ethics» insisted that knowledge should be practical, not contemplative. Plato's gesture is not an escape from the earth but a pointing to the source of order that Aristotle seeks already inside the world itself. They walk side by side, and this is the main idea of the fresco: truth belongs to neither of them, it is born from their dispute.<br><br>Around the central pair Raphael gathers philosophers, mathematicians and astronomers — almost everyone who could be «identified» by ancient busts, texts or tradition. To the left of Plato, in the group of listeners, stands Socrates: he is recognised by his characteristic bald head and by the gesture with which he is apparently proving something to his interlocutors. Lower down, on the steps, Diogenes of Sinope lies half-reclining — in rags, with a cup in his hand, the embodiment of Cynic contempt for conventions; his pose and position in the composition work as a «pause» in the general movement, a point of indifference to vanity. In the lower left corner, at a board, sits Pythagoras. He is writing down a scheme of musical intervals — the very harmony of numbers that Plato would later develop in the «Timaeus» as the harmony of the cosmos. On the board in front of him a diagram connected with his teaching on numbers and musical proportions is visible. Some researchers note that Vasari, describing the fresco, mistook Pythagoras for the evangelist Matthew dictating a text — so strong was the habit of seeing Christian subjects in scenes like this.<br><br>To the right of Aristotle there is also a group of scholars. Below, bending over a tablet with a geometric drawing, stands a man with a compass. He is usually identified as Euclid (less often as Archimedes), and around him are four young men eagerly following the construction. Nearby, slightly higher, is Ptolemy with an earthly globe in his hand and another astronomer with a celestial globe; their conversation is about two systems, the earthly and the heavenly, which still have to be reconciled. In the very corner, at the edge of the fresco, Raphael placed himself: a young man in a black beret looks straight at the viewer. This is not a modest signature but a gesture: the artist stands in the same row as the philosophers, because for Raphael painting is also a way of knowing.<br><br>The architecture in which the action takes place is not just a background. It is a majestic vaulted interior with arches, coffers and statues of Apollo and Athena in niches on the sides. It is believed that Raphael worked on this space together with the architect Donato Bramante, and the perspective construction reflects Bramante's ideas about the revival of Roman antiquity: the power of the Basilica of Maxentius and the project of the new St. Peter's Basilica can be read in these arches. The space of the fresco does not «contain» the figures but organises them: it sets the hierarchy and the direction of the gaze, leading from the centre to the periphery and back. In this sense «The School of Athens» is not just a group portrait of philosophers but a visual model of knowledge: it has a centre, it has a dispute, it has a periphery where knowledge becomes a craft and a tool.<br><br>A separate topic is the identification of the figures. Some of them are beyond doubt: Plato, Aristotle, Socrates, Pythagoras, Euclid, Ptolemy, Diogenes. Others have remained a subject of debate for centuries. For example, Heraclitus, sitting alone in the foreground on the left, was painted from Michelangelo: gloomy, thoughtful, leaning on a block of marble. Raphael probably saw him in the Sistine Chapel or knew about his work there and inserted this figure as a kind of homage to his rival — or as a polemical gesture: Michelangelo-Heraclitus weeps over the world while others build it anew. There is also a version that Plato was painted from Leonardo da Vinci: the similarity of profile and beard is too noticeable to be accidental. If so, Raphael builds a genealogy: Leonardo-Plato points upwards, Michelangelo-Heraclitus is immersed in himself, and Raphael himself stands in the corner and looks at the viewer — three generations of artists in one space.<br><br>Symbolically, the fresco reads as a compendium of the Renaissance idea of knowledge. The statues of Apollo and Athena on the sides of the hall remind us that philosophy does not cancel poetry and wisdom but coexists with them. Above the whole scene is the sky, but not a Christian sky — an ancient sky, clear and empty. That is why «The School of Athens» is so often perceived as a manifesto of humanism: here man, by himself, without divine intervention, seeks truth, and this seeking is depicted not as a sin but as greatness. Raphael does not set Athens against Jerusalem — he places them side by side, on opposite walls of one room, and leaves it to the viewer to decide where one ends and the other begins."
                },

                coords: [45.62, 11.85], image: "assunta.jpg", audio: "missa.mp3", color: "blue",
                                text: { 
                    ru: "«Ассунта» (полное название — «Вознесение Богородицы», итал. Assunta) — алтарная картина итальянского живописца Тициана Вечеллио, представителя венецианской школы. Написана в 1516–1518 годах маслом на деревянной панели, собранной из горизонтальных досок тополя или кедра. Размеры — примерно 690 × 360 см, что делает её одним из самых больших алтарных образов на дереве в мире. Хранится на историческом месте — над главным алтарем базилики Санта-Мария-Глориоза-деи-Фрари в Венеции.<br><br>Это был первый крупный публичный заказ Тициана в родном городе, и именно он утвердил его статус ведущего живописца Венеции. Заказ поступил в 1516 году от [приора] францисканского монастыря фра Джермано да Казале. Работа заняла ровно два года, и 19 мая 1518 года картину торжественно открыли. Дата выбрана не случайно — это день праздника Пятидесятницы (Троицы), когда на апостолов сошёл Святой Дух. Смысл такого совпадения в том, что открытие картины в этот день превращало её в часть богослужения: сцена вознесения Марии оказывалась созвучна празднику, в который апостолы получают силу для проповеди, а сама картина — не просто новым украшением церкви, а событием внутри церковного года.<br><br>Сюжет — Вознесение Девы Марии. Согласно католическому учению, после смерти Мария была взята на небо душой и телом. Тициан выстраивает композицию по вертикали, в три яруса. Внизу — апостолы, сбившиеся в плотную группу. Они остались на земле, но уже знают, что происходит нечто, выходящее за пределы человеческого опыта: их запрокинутые лица и жесты передают смятение и восторг, они тянутся к Марии, но не могут за ней последовать. В середине — сама Мария, в алом платье и синем плаще, стоит на облаке, поддерживаемая ангелами. Она не взлетает сама: её несут. Вознесение в католической традиции понимается как действие божественной силы, которая забирает её к себе, и облако с ангелами визуально эту силу и воплощает.<br><br>Ангелы, несущие её, — [путти], то есть их роль скорее декоративно-символическая, чем функционально-смысловая. Вверху — Бог Отец, встречающий Марию с распростёртыми руками, а рядом ангел с короной. Марию коронуют как Царицу Небесную.<br><br>Цвет в «Ассунте» работает как драматургия. Алое платье Марии — это цвет крови, жертвы и одновременно царского достоинства; синий плащ — цвет неба и божественной тайны. Вместе они отсылают к традиционной иконографии Богоматери, но Тициан делает красный настолько насыщенным, что он становится смысловым центром композиции. Двое апостолов внизу тоже одеты в красное, и этот цвет протягивает нить от земной группы вверх, к возносящейся фигуре: земля и небо оказываются связаны одним цветом. Золотой свет вокруг Марии отсылает к венецианской мозаичной традиции: Тициан начинал как мозаичист и хорошо чувствовал, как золото преображает пространство.<br><br>На самом деле, из-за этой картины между Тицианом и некоторыми монахами возник спор. Вторые, по свидетельству историка Ридольфини, сомневались, стоит ли принимать работу: их смущала «простонародная» внешность апостолов и слишком крупный масштаб фигур. Тициан, по преданию, отвечал, что такие размеры необходимы, чтобы картина «читалась» с дальнего конца длинного [нефа]. И это не отговорка: он писал не для нейтральной стены, а для конкретного места. Картина висела над главным алтарем готической церкви, за резным мраморным экраном хоров XV века — невысокой перегородкой, отделявшей пространство клироса от нефа, — и зритель смотрел на неё с дальнего конца нефа, сквозь арку этого экрана. С обеих сторон алтаря в [апсиде] есть окна, создающие [контражур]. Тициан учитывал, что свет будет падать сзади, и выстроил композицию так, чтобы она работала именно в этих условиях: вертикальный формат вторит устремлённости готических сводов, а мощный цвет не теряется в контражуре. Картина встроена в церковь, а не просто висит в ней, и в этом главный урок «Ассунты»: великое произведение начинается с того, что художник смотрит не только на сюжет, но и на место, где этому сюжету предстоит жить.",
                    en: "«Assunta» (full title — «The Assumption of the Virgin», Italian: Assunta) is an altarpiece by the Italian painter Titian Vecellio, a representative of the Venetian school. It was painted in 1516–1518 in oil on a wooden panel assembled from horizontal boards of poplar or cedar. Its size is approximately 690 × 360 cm, which makes it one of the largest altarpieces on wood in the world. It is kept in its historical place — above the main altar of the Basilica of Santa Maria Gloriosa dei Frari in Venice.<br><br>This was Titian's first major public commission in his native city, and it was this work that established his status as the leading painter of Venice. The commission came in 1516 from [the prior] of the Franciscan monastery, Fra Germano da Casale. The work took exactly two years, and on 19 May 1518 the painting was solemnly unveiled. The date was not chosen by chance — it is the feast of Pentecost (Trinity), when the Holy Spirit descended upon the apostles. The meaning of this coincidence is that unveiling the painting on that day turned it into part of the service: the scene of Mary's assumption resonated with the feast on which the apostles receive the power to preach, and the painting itself became not just a new decoration of the church but an event within the church year.<br><br>The subject is the Assumption of the Virgin Mary. According to Catholic teaching, after her death Mary was taken up to heaven in soul and body. Titian builds the composition vertically, in three tiers. At the bottom are the apostles, gathered in a dense group. They have remained on earth, but they already know that something beyond human experience is happening: their upturned faces and gestures convey confusion and delight, they reach towards Mary but cannot follow her. In the middle is Mary herself, in a scarlet dress and a blue cloak, standing on a cloud supported by angels. She does not fly up by herself: she is carried. In Catholic tradition, the Assumption is understood as the action of divine power that takes her to itself, and the cloud with angels visually embodies this power.<br><br>The angels carrying her are [putti], that is, their role is more decorative and symbolic than functional and meaningful. At the top is God the Father, meeting Mary with open arms, and next to him an angel with a crown. Mary is crowned as Queen of Heaven.<br><br>Colour in the «Assunta» works as drama. Mary's scarlet dress is the colour of blood, sacrifice and at the same time royal dignity; the blue cloak is the colour of heaven and divine mystery. Together they refer to the traditional iconography of the Mother of God, but Titian makes the red so intense that it becomes the semantic centre of the composition. Two apostles at the bottom are also dressed in red, and this colour stretches a thread from the earthly group upwards, to the ascending figure: earth and heaven turn out to be connected by one colour. The golden light around Mary refers to the Venetian mosaic tradition: Titian began as a mosaicist and well understood how gold transforms space.<br><br>In fact, this painting caused a dispute between Titian and some of the monks. According to the historian Ridolfini, the latter doubted whether to accept the work: they were troubled by the «common» appearance of the apostles and the too-large scale of the figures. Titian, according to tradition, replied that such dimensions were necessary for the painting to «read» from the far end of the long [nave]. And this is not an excuse: he painted not for a neutral wall but for a specific place. The painting hung above the main altar of a Gothic church, behind the carved marble choir screen of the 15th century — a low partition separating the choir space from the nave — and the viewer looked at it from the far end of the nave, through the arch of this screen. On both sides of the altar in the [apse] there are windows creating [backlighting]. Titian took into account that the light would fall from behind, and built the composition so that it would work precisely in these conditions: the vertical format echoes the upward thrust of the Gothic vaults, and the powerful colour does not get lost in the backlight. The painting is built into the church, not simply hanging in it, and this is the main lesson of the «Assunta»: a great work begins with the artist looking not only at the subject but also at the place where this subject is to live."
                },
                               footnotes: {

ну, изобразив только Христа и апостолов.<br><br>Веронезе пошёл на хитрость: он не стал переписывать фигуры и менять композицию, а просто изменил название. Надпись на [балюстраде], где раньше стояло «Тайная вечеря», он заменил на «Пир в доме Левия». Формально сюжет был другим, и придирки теряли силу. Так картина сохранила свой праздничный, шумный, абсолютно не сакральный вид — и вошла в историю как пример того, как художник обошёл цензуру, не изменив ни одного мазка.",

he canvas with figures «as his imagination suggested to him». The [inquisitors] did not accept this justification and demanded that within three months he repaint the picture, depicting only Christ and the apostles.<br><br>Veronese resorted to a trick: he did not repaint the figures or change the composition, but simply changed the title. The inscription on the [balustrade], where «The Last Supper» had previously stood, he replaced with «The Feast in the House of Levi». Formally, the subject was now different, and the objections lost their force. So the painting kept its festive, noisy, absolutely unsacred appearance — and went down in history as an example of how an artist got around censorship without changing a single brushstroke."

                  function goBack() {

        function switchCountry(country) {
            hideAll();
            document.getElementById('country-list').style.display = 'block';
            currentCountry = country;
            if (country === 'france') {
                map.removeLayer(italyLayer); franceLayer.addTo(map); map.setView([46.5, 2.0], 6);
                map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            } else {
                ensureItaly();
                drawMarkers('italy', 'all');
            }
        }

        // Обработка текста (жирный шрифт и сноски)
        function processText(text, footnotes) {
            if(!text) return '';
            let processed = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Ищем сноски в квадратных скобках
            if (footnotes) {
                for (const [key, val] of Object.entries(footnotes)) {
                    let searchStr = '[' + key + ']';
                    let replaceStr = `<span class="footnote" data-text="${val.replace(/"/g, '&quot;')}">${key}</span>`;
                    processed = processed.split(searchStr).join(replaceStr);
                }
            }
            return processed;
        }

        function drawMarkers(country, era = 'all', artistId = 'all', specificWorkId = 'all') {
            map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });

            artworks.forEach(function(art) {
                if (art.country !== country) return;
                if (era !== 'all' && art.era !== era) return;
                if (artistId !== 'all' && art.artist !== artistId) return;
                if (specificWorkId !== 'all' && art.id !== specificWorkId) return;

                // Получаем сноски для текущего языка, если они есть
                var artFootnotes = null;
                if (art.footnotes) {
                    artFootnotes = art.footnotes[currentLang];
                }

                var formattedText = processText(art.text[currentLang], artFootnotes);

                // Блок сносок для Венецианской школы (специальная рамочка)
                var specialBox = '';
                if (art.specialFootnote && art.specialFootnote[currentLang]) {
                    specialBox = `<div class="special-footnote-box">${art.specialFootnote[currentLang]}</div>`;
                }

                var audioBox = art.audio ? `<div class="audio-wrapper"><p><strong>Музыка:</strong></p><audio controls><source src="${art.audio}" type="audio/mpeg"></audio></div>` : '';

                var popupContent = `
                    <img src="${art.image}" class="popup-image" alt="${art.title[currentLang]}">
                    <h3>${art.title[currentLang]} (${art.year})</h3>
                    <p><strong>${currentLang === 'ru' ? 'Художник' : 'Artist'}:</strong> ${artists[art.artist] ? artists[art.artist].title[currentLang] : 'Неизвестен'}</p>
                    <p><strong>${currentLang === 'ru' ? 'Место создания' : 'Place of creation'}:</strong> ${art.city[currentLang]}</p>
                    <p><strong>${currentLang === 'ru' ? 'Место хранения' : 'Current location'}:</strong> ${art.museum[currentLang]}</p>
                    <p>${formattedText}</p>
                    ${specialBox}
                    ${audioBox}
                `;

                var markerIcon = new L.Icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-' + art.color + '.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                });

                L.marker(art.coords, {icon: markerIcon}).addTo(map).bindPopup(popupContent, { maxHeight: 600 });
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('btn-countries').innerText = currentLang === 'ru' ? '🏛️ Страны' : '🏛️ Countries';

            document.getElementById('btn-paduan').innerText = currentLang === 'ru' ? 'Падуанская школа' : 'Paduan School';
            document.getElementById('btn-umbrian').innerText = currentLang === 'ru' ? 'Умбрийская школа' : 'Umbrian School';
            document.getElementById('btn-roman').innerText = currentLang === 'ru' ? 'Римская школа' : 'Roman School';

            document.getElementById('btn-early').innerText = currentLang === 'ru' ? 'Раннее Возрождение' : 'Early Renaissance';
            document.getElementById('btn-high').innerText = currentLang === 'ru' ? 'Высокое Возрождение' : 'High Renaissance';
            document.getElementById('btn-late').innerText = currentLang === 'ru' ? 'Позднее Возрождение' : 'Late Renaissance';

            hideAll();

            drawMarkers('italy', 'all');
                        document.getElementById('feedback-text').innerText = currentLang === 'ru' ? 'Есть идея для карты?' : 'Have an idea for the map?';
