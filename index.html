<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка координат</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.98); z-index: 1000; padding: 20px; box-sizing: border-box; }
        #map { height: 100%; width: calc(100% - 350px); margin-left: 350px; z-index: 1; background-color: #e8dcc4; }
    </style>
</head>
<body>

    <div id="panel">
        <h2>Настройка координат</h2>
        <p style="font-size: 14px; color: #5d4037;">Рим (красный) сдвинут.</p>
        <p style="font-size: 12px; color: #888;">Текущие координаты: [42.40, 11.90]</p>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 9, center: [44.0, 10.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);

        var testImage = "map.webp";

        function createMarker(coords, color, title) {
            var markerIcon = new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-' + color + '.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            });
            return L.marker(coords, {icon: markerIcon}).bindPopup(`<img src="${testImage}" style="width:100%; max-height:200px; object-fit:contain; margin-bottom:10px;"><h3>${title}</h3>`);
        }

        // ВЕНЕЦИЯ (Синий)
        createMarker([45.55, 11.75], "blue", "Юдифь").addTo(map);
        createMarker([45.48, 11.68], "blue", "Спящая Венера").addTo(map);
        createMarker([45.62, 11.85], "blue", "Ассунта").addTo(map);
        
        // ФЛОРЕНЦИЯ / АРЕЦЦО (Зеленый)
        createMarker([44.05, 10.85], "green", "Рождение Венеры").addTo(map);
        createMarker([44.05, 10.95], "green", "Мона Лиза").addTo(map);
        createMarker([43.80, 11.45], "green", "Битва Константина").addTo(map);
        
        // МАНТУЯ (Фиолетовый)
        createMarker([45.25, 10.70], "violet", "Камера дельи Спози").addTo(map);
        
        // МИЛАН (Желтый)
        createMarker([45.55, 9.75], "yellow", "Тайная вечеря").addTo(map);
        
        // РИМ (Красный, сдвинут влево и вверх)
        createMarker([42.40, 11.90], "red", "Афинская школа (Рим)").addTo(map);

    </script>
</body>
</html>
