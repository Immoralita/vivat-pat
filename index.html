<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Самая простая карта
        var map = L.map('map').setView([45.0, 12.0], 7);
        L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);

        // Самая простая точка
        L.marker([45.55, 11.75]).addTo(map).bindPopup('Привет! Я работаю!');
    </script>
</body>
</html>
