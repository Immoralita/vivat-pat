<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivat-Pat | Карта Возрождения</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; background-color: #e8dcc4; }
        
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.95); z-index: 1000; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .panel-content { padding: 20px; overflow-y: auto; height: 100%; }
        
        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; }
        .tab-btn:hover { background: #e0d0c0; }
        
        #lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(245, 235, 220, 0.9); border: 1px solid #8b5a2b; padding: 8px 15px; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; color: #3e2723; }
        
        .leaflet-popup-content { font-family: 'Georgia', serif; color: #3e2723; max-width: 650px; font-size: 15px; }
        .leaflet-popup-content h3 { margin: 0 0 10px 0; font-size: 22px; color: #2c1a14; }
        .leaflet-popup-content p { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
        .popup-image { width: 100%; height: auto; border-radius: 4px; margin-bottom: 12px; border: 1px solid #8b5a2b; }
        
        .footnote { border-bottom: 1px dotted #8b5a2b; cursor: help; position: relative; color: #5d4037; }
        .footnote:hover::after { content: attr(data-text); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #3e2723; color: white; padding: 8px; border-radius: 4px; font-size: 13px; width: 250px; z-index: 2000; line-height: 1.3; pointer-events: none; }
        
        .audio-wrapper { margin-top: 15px; padding-top: 10px; border-top: 1px solid #8b5a2b; }
        audio { width: 100%; }
    </style>
</head>
<body>

    <button id="lang-switch" onclick="toggleLanguage()">EN</button>

    <div id="panel">
        <div class="panel-content">
            <h2 id="site-title">Vivat-Pat</h2>
            <p id="panel-desc" style="font-size: 14px; color: #5d4037; margin-bottom: 20px;">Интерактивная карта шедевров Возрождения.</p>
            
            <button class="tab-btn" onclick="showMenu()" id="btn-countries">🏛️ Страны</button>
            <div id="country-list" style="display: none; margin-bottom: 15px;">
                <button class="tab-btn" onclick="switchCountry('italy')">🇮🇹 Италия</button>
                <div id="era-list" style="padding-left: 15px; margin-bottom: 10px;">
                    <button class="tab-btn" onclick="filterEra('high')" style="font-size: 14px;">Высокое Возрождение</button>
                </div>
                <button class="tab-btn" onclick="switchCountry('france')">🇫🇷 Франция</button>
            </div>
        </div>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 8, center: [45.0, 12.0], zoom: 7, zoomControl: false });

        // Карты
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);
        var franceLayer = L.imageOverlay('map_france.webp', [[42.0, -5.0], [51.5, 8.5]]);

        var currentEra = 'high';
        var currentLang = 'ru';

        var artworks = [
            {
                country: "italy",
                era: "high", 
                title: { ru: "Юдифь", en: "Judith" },
                year: "ок. 1502",
                city: { ru: "Венеция", en: "Venice" }, 
                museum: { ru: "Государственный Эрмитаж, Санкт-Петербург", en: "State Hermitage, St. Petersburg" },
                coords: [45.55, 11.75], 
                author: { ru: "Джорджоне", en: "Giorgione" }, 
                image: "judith.jpg", 
                audio: "vivaldi.mp3",
                text: { 
                    ru: "**«Юдифь»** — картина итальянского живописца Джорджоне (Джорджо Барбарелли да Кастельфранко), представителя [венецианской школы]. Несмотря на то, что художник имел привычку не подписывать свои работы, она [единодушно атрибутирована] ему. С 1772 года находится в Государственном Эрмитаже.<br><br>Картина отсылает нас к ветхозаветному сюжету, а именно к книге Юдифь, [неканонической] в православии, [второканонической] в католицизме и [апокрифичной] в протестантизме.<br><br>Олоферн начал осаду, перекрывая горожанам доступ к воде. И здесь появляется наша **Юдифь**. Оставшись одна с Олоферном, Юдифь помолилась, прося Бога [укрепить её], затем сняла меч и отрубила ему голову.",
                    en: "**«Judith»** is a painting by the Italian artist Giorgione, a representative of the [Venetian school]. Although he had a habit of not signing his works, it is [unanimously attributed] to him. Since 1772 it has been in the State Hermitage.<br><br>The painting refers to the Book of Judith, [non-canonical] in Orthodoxy, [deuterocanonical] in Catholicism and [apocryphal] in Protestantism.<br><br>Holofernes began the siege, cutting off access to water. And here our **Judith** appears. Left alone with Holofernes, Judith prayed, asking God [to strengthen her], then took the sword and cut off his head."
                },
                footnotes: {
                    ru: {
                        "венецианской школы": "**Венецианская школа** — одна из ведущих живописных школ Италии. Прославилась виртуозным владением цветом.",
                        "единодушно атрибутирована": "Абсолютным большинством специалистов признана творением этого автора.",
                        "неканонической": "Книга Ветхого Завета, которой нет в древнееврейском каноне, но есть в православных изданиях.",
                        "второканонической": "То же, что «неканонические», но в католической традиции.",
                        "апокрифичной": "В протестантизме так называют книги, которые православные называют «неканоническими».",
                        "укрепить её": "Даровать силы для нанесения смертельного удара."
                    },
                    en: {
                        "Venetian school": "**The Venetian school** is one of the leading painting schools of Italy. Famous for its mastery of colour.",
                        "unanimously attributed": "Recognised by the absolute majority of specialists.",
                        "non-canonical": "A book not in the Hebrew canon, but included in Orthodox editions.",
                        "deuterocanonical": "Same as «non-canonical», but in the Catholic tradition.",
                        "apocryphal": "In Protestantism, books that the Orthodox call «non-canonical».",
                        "to strengthen her": "To grant strength to deliver a fatal blow."
                    }
                }
            }
        ];

        // Меню
        function showMenu() {
            var list = document.getElementById('country-list');
            list.style.display = list.style.display === 'none' ? 'block' : 'none';
        }

        function switchCountry(country) {
            if (country === 'france') {
                map.removeLayer(italyLayer);
                franceLayer.addTo(map);
                map.setView([46.5, 2.0], 6);
                drawMarkers('france');
            } else {
                if(map.hasLayer(franceLayer)) map.removeLayer(franceLayer);
                italyLayer.addTo(map);
                map.setView([45.0, 12.0], 7);
                drawMarkers('italy');
            }
        }

        function filterEra(era) {
            currentEra = era;
            drawMarkers('italy');
        }

        // Текст и сноски
        function processText(text, footnotes) {
            let processed = text;
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            if (footnotes) {
                for (const [key, val] of Object.entries(footnotes)) {
                    let searchStr = '[' + key + ']';
                    let replaceStr = `<span class="footnote" data-text="${val.replace(/"/g, '&quot;')}">${key}</span>`;
                    processed = processed.split(searchStr).join(replaceStr);
                }
            }
            return processed;
        }

        function drawMarkers(country) {
            map.eachLayer(function (layer) {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });

            artworks.forEach(function(art) {
                if (art.country === country && art.era === currentEra) {
                    var formattedText = processText(art.text[currentLang], art.footnotes ? art.footnotes[currentLang] : null);
                    
                    var popupContent = `
                        <img src="${art.image}" class="popup-image" alt="${art.title[currentLang]}">
                        <h3>${art.title[currentLang]} (${art.year})</h3>
                        <p><strong>${currentLang === 'ru' ? 'Художник' : 'Artist'}:</strong> ${art.author[currentLang]}</p>
                        <p><strong>${currentLang === 'ru' ? 'Место создания' : 'Place of creation'}:</strong> ${art.city[currentLang]}</p>
                        <p><strong>${currentLang === 'ru' ? 'Место хранения' : 'Current location'}:</strong> ${art.museum[currentLang]}</p>
                        <p>${formattedText}</p>
                        <div class="audio-wrapper">
                            <p><strong>${currentLang === 'ru' ? 'Музыка:' : 'Music:'}</strong> Оратория Вивальди «Торжествующая Юдифь».</p>
                            <audio controls><source src="${art.audio}" type="audio/mpeg"></audio>
                        </div>
                    `;

                    L.marker(art.coords).addTo(map).bindPopup(popupContent, { maxHeight: 500 });
                }
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('panel-desc').innerText = currentLang === 'ru' ? 'Интерактивная карта шедевров Возрождения.' : 'Interactive map of Renaissance masterpieces.';
            document.getElementById('btn-countries').innerText = currentLang === 'ru' ? '🏛️ Страны' : '🏛️ Countries';
            drawMarkers('italy');
        }

        drawMarkers('italy');
    </script>
</body>
</html>
