<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка координат</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.98); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        #map { height: 100%; width: calc(100% - 350px); margin-left: 350px; z-index: 1; background-color: #e8dcc4; }
        
        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; }
        
        #mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #e8dcc4; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; font-family: 'Georgia', serif; color: #3e2723; }
        @media (max-width: 768px) {
            #panel, #map { display: none; }
            #mobile-overlay { display: flex; }
        }
    </style>
</head>
<body>

    <div id="mobile-overlay">
        <h2>Vivat-Pat</h2>
        <p>Откройте на компьютере.</p>
    </div>

    <div id="panel">
        <h2>Настройка координат</h2>
        <p style="font-size: 14px; color: #5d4037;">Сейчас настраиваем: <b>Милан (желтая точка)</b>.</p>
        <p style="font-size: 12px; color: #888;">Текущие координаты: [44.50, 8.50]</p>
        
        <button class="tab-btn" onclick="drawAll()" style="margin-top: 20px;">Показать все точки</button>
        <button class="tab-btn" onclick="drawMilan()">Показать только Милан</button>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 8, center: [45.0, 12.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);

        // Точка Милана, которую мы настраиваем
        var milanCoords = [44.50, 8.50]; 
        
        // Картинка для теста (берем гравюру, чтобы точно не было битой иконки)
        var testImage = "map.webp";

        function createMarker(coords, color, title) {
            var markerIcon = new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-' + color + '.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            });
            return L.marker(coords, {icon: markerIcon}).bindPopup(`<img src="${testImage}" style="width:100%; max-height:200px; object-fit:contain; margin-bottom:10px;"><h3>${title}</h3>`);
        }

        function drawMilan() {
            map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            createMarker(milanCoords, "yellow", "Милан (Тайная вечеря)").addTo(map);
        }

        function drawAll() {
            map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            
            // Венеция
            createMarker([45.55, 11.75], "blue", "Юдифь").addTo(map);
            createMarker([45.50, 11.80], "blue", "Спящая Венера").addTo(map);
            createMarker([45.43, 12.32], "blue", "Ассунта").addTo(map);
            
            // Флоренция / Ареццо
            createMarker([44.15, 10.85], "green", "Рождение Венеры").addTo(map);
            createMarker([44.10, 10.95], "green", "Мона Лиза").addTo(map);
            createMarker([43.25, 11.85], "green", "Битва Константина").addTo(map);
            createMarker([45.16, 10.80], "violet", "Камера дельи Спози").addTo(map);
            
            // Милан
            createMarker(milanCoords, "yellow", "Тайная вечеря").addTo(map);
            
            // Рим (теперь с картой вместо битой картинки)
            createMarker([42.10, 12.20], "pink", "Афинская школа").addTo(map);
        }

        drawMilan(); // По умолчанию показываем только Милан
    </script>
</body>
</html>
