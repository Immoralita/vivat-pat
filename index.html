<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivat-Pat | Карта Возрождения</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .leaflet-attribution-flag { display: none !important; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; background-color: #e8dcc4; }
        
        #panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: rgba(245, 235, 220, 0.95); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .tab-btn { background: none; border: 1px solid #8b5a2b; color: #3e2723; padding: 10px; width: 100%; cursor: pointer; font-family: 'Georgia', serif; font-size: 16px; text-align: left; margin-bottom: 5px; transition: background 0.2s; }
        .tab-btn:hover { background: #e0d0c0; }
        
        #lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(245, 235, 220, 0.9); border: 1px solid #8b5a2b; padding: 8px 15px; cursor: pointer; font-size: 16px; font-family: 'Georgia', serif; color: #3e2723; }
        
        .leaflet-popup-content { font-family: 'Georgia', serif; color: #3e2723; max-width: 650px; font-size: 15px; }
        .leaflet-popup-content h3 { margin: 0 0 10px 0; font-size: 22px; color: #2c1a14; }
        .leaflet-popup-content p { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
        .popup-image { width: 100%; height: auto; border-radius: 4px; margin-bottom: 12px; border: 1px solid #8b5a2b; }
        
        .footnote { border-bottom: 1px dotted #8b5a2b; cursor: help; position: relative; color: #5d4037; font-weight: bold; }
        .footnote:hover::after { content: attr(data-text); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #3e2723; color: white; padding: 10px; border-radius: 4px; font-size: 13px; width: 250px; z-index: 2000; line-height: 1.3; pointer-events: none; font-weight: normal; }
        
        .audio-wrapper { margin-top: 15px; padding-top: 10px; border-top: 1px solid #8b5a2b; }
        audio { width: 100%; margin-top: 5px; }

        @media (max-width: 600px) {
            #panel { width: 100%; height: 50%; top: auto; bottom: 0; transform: translateY(100%); transition: transform 0.3s ease; border-radius: 20px 20px 0 0; padding: 15px; }
            #panel.open { transform: translateY(0); }
            .leaflet-popup-content { max-width: 90vw; }
        }
    </style>
</head>
<body>

    <button id="lang-switch" onclick="toggleLanguage()">EN</button>

    <div id="panel">
        <h2 id="site-title">Vivat-Pat</h2>
        <p id="panel-desc" style="font-size: 14px; color: #5d4037; margin-bottom: 20px;">Интерактивная карта шедевров Возрождения.</p>
        
        <button class="tab-btn" onclick="showMenu()" id="btn-countries">🏛️ Страны</button>
        <div id="country-list" style="display: none; margin-top: 10px;">
            <button class="tab-btn" onclick="switchCountry('italy')" id="btn-italy">Италия</button>
            <div style="padding-left: 15px; margin-bottom: 5px;">
                <button class="tab-btn" onclick="drawMarkers('italy')" id="btn-renaissance" style="font-size: 14px;">Высокое Возрождение</button>
            </div>
            <button class="tab-btn" onclick="switchCountry('france')" id="btn-france">Франция</button>
        </div>
        
        <hr style="border: 1px solid #8b5a2b; margin: 20px 0;">
        <p style="font-size: 14px;">
            <span id="feedback-text">Есть идея для карты?</span><br>
            <a href="mailto:patyukhova@gmail.com?subject=Идея для Vivat-Pat" id="feedback-link" style="color: #8b5a2b;">✉️ Написать мне</a>
        </p>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map', { minZoom: 5, maxZoom: 8, center: [45.0, 12.0], zoom: 7, zoomControl: false });
        var italyLayer = L.imageOverlay('map.webp', [[36.5, 5.0], [47.5, 20.0]]).addTo(map);
        var franceLayer = L.imageOverlay('map_france.webp', [[42.0, -5.0], [51.5, 8.5]]);

        var currentLang = 'ru';

        var artworks = [
            {
                country: "italy",
                title: { ru: "Юдифь", en: "Judith" },
                year: "ок. 1502",
                city: { ru: "Венеция", en: "Venice" }, 
                museum: { ru: "Государственный Эрмитаж, Санкт-Петербург", en: "State Hermitage, St. Petersburg" },
                author: { ru: "Джорджоне", en: "Giorgione" }, 
                coords: [45.55, 11.75], 
                image: "judith.jpg", 
                audio: "vivaldi.mp3",
                text: { 
                    ru: "**«Юдифь»** — картина итальянского живописца Джорджоне (Джорджо Барбарелли да Кастельфранко), представителя [венецианской школы]. Несмотря на то, что художник имел привычку не подписывать свои работы, она [единодушно атрибутирована] ему по совокупности стилистических, технических и исторических данных. С 1772 года находится в Государственном Эрмитаже, куда была перевезена из парижского собрания барона Луи Антуана Кроза де Тьера.<br><br>Картина отсылает нас к ветхозаветному сюжету, а именно к книге Юдифь (в синодальном переводе — «Книга Иудифь», в католической традиции — «Юдифь»), [неканонической] в православии, [второканонической] в католицизме и [апокрифичной] в протестантизме.<br><br>Для начала объяснимся с именами: Навуходоносор — ассирийский царь. Арфаксад — персидский царь. Олоферн — ассирийский военачальник. Ахиор — предводитель аммонитян. Юдифь — красивая и набожная вдова из города Ветилуя.<br><br>Согласно книге, между Ассирийским и Персидским царствами шла война. Некоторые западные земли отказались присоединиться к войску Навуходоносора. После победы над Арфаксадом, Навуходоносор дал поручение Олоферну: «И объявишь им, чтобы они [приготовляли землю и воду], потому что я с гневом выйду на них...» (Книга Иудифь 2:7). Постепенно Олоферн покорял город за городом, пока не настал черёд земель Израиля. Олоферн начал осаду, перекрывая горожанам доступ к воде. Жители начали страдать. Тогда один из старейшин (Озия) выступил со словами: «...потерпим еще пять дней...» (Книга Иудифь 7:30).<br><br>И здесь появляется наша **Юдифь**. Услышав слова о сдаче города, она позвала старейшин к себе домой... **План Юдифи** был довольно хорошо продуман. Для пущей наглядности разделим его на четыре части:<br><br>**Шаг 1: Подготовка и вход в доверие.**<br>• Внешний вид: Она сняла траурные одежды, омылась, умастилась благовониями и надела лучшие наряды.<br>• Легенда: Придя в стан, она представилась пророчицей, бежавшей от своих, чтобы помочь Олоферну. Юдифь пообещала указать ему путь к лёгкой победе, но с условием: ей должно быть позволено каждую ночь выходить на молитву.<br><br>**Шаг 2: Ловушка на пиру.**<br>• Роль вина: Олоферн, желая произвести на неё впечатление, пил «вина весьма много, сколько не пил никогда...» (Книга Иудифь 12:20).<br><br>**Шаг 3: Момент удара.**<br>• Молитва и действие: Оставшись одна, Юдифь помолилась, прося Бога [укрепить её], затем сняла со столбика изголовья меч Олоферна, схватила его за волосы и двумя ударами отрубила голову.<br><br>**Шаг 4: Психологическая атака и победа.**<br>• Демонстрация: Голову полководца вывесили на городской стене. Войско ассирийцев, охваченное паникой, обратилось в бегство.",
                    
                    en: "**«Judith»** is a painting by the Italian artist Giorgione (Giorgio Barbarelli da Castelfranco), a representative of the [Venetian school]. Although he had a habit of not signing his works, it is [unanimously attributed] to him based on a combination of stylistic, technical and historical data. Since 1772 it has been in the State Hermitage, where it was brought from the Paris collection of Baron Louis Antoine Crozat de Thiers.<br><br>The painting refers to an Old Testament story, namely the Book of Judith, [non-canonical] in Orthodoxy, [deuterocanonical] in Catholicism and [apocryphal] in Protestantism.<br><br>First, let us explain the names: Nebuchadnezzar — the Assyrian king. Arphaxad — the Persian king. Holofernes — the Assyrian military commander. Achior — the leader of the Ammonites. Judith — a beautiful and devout widow from the city of Bethulia.<br><br>According to the book, there was a war between the Assyrian and Persian kingdoms. Some western lands refused to join Nebuchadnezzar's army. After the victory over Arphaxad, Nebuchadnezzar gave Holofernes an order: «Tell them to prepare earth and water, for I am coming against them in my anger...» (Book of Judith 2:7). Gradually Holofernes conquered city after city, until the turn of the lands of Israel came. Holofernes began the siege, cutting off the townspeople's access to water. The inhabitants began to suffer. Then one of the elders (Ozias) spoke these words: «Brethren, be of good courage! Let us endure five more days...» (Book of Judith 7:30).<br><br>And here our **Judith** appears. Hearing the words about surrendering the city, she called the elders to her home... **Judith's plan** was quite well thought out. For greater clarity, let us divide it into four parts:<br><br>**Step 1: Preparation and gaining trust.**<br>• Appearance: She took off her mourning clothes, washed herself, anointed herself with incense and put on her best outfits.<br>• Legend: Arriving at the Assyrian camp, she introduced herself as a prophetess... Judith promised to show him the way to an easy victory, but on one condition: she must be allowed to go out every night to pray.<br><br>**Step 2: The trap at the feast.**<br>• The role of wine: Holofernes, wishing to impress her, «drank a great quantity of wine, much more than he had ever drunk...» (Book of Judith 12:20).<br><br>**Step 3: The moment of the blow.**<br>• Prayer and action: Left alone, Judith prayed, asking God [to strengthen her], then took Holofernes' sword from the bedpost, grabbed him by the hair and cut off his head with two blows.<br><br>**Step 4: Psychological attack and victory.**<br>• Demonstration: The head of the commander was hung on the city wall. The army, seized with panic, fled."
                },
                footnotes: {
                    ru: {
                        "венецианской школы": "**Венецианская школа** — одна из ведущих живописных школ Италии. Прославилась прежде всего виртуозным владением цветом и светом, а не рисунком.",
                        "единодушно атрибутирована": "Абсолютным большинством специалистов признана творением конкретно этого автора.",
                        "неканонической": "Книга Ветхого Завета, которой нет в древнееврейском каноне, но которая включена в православные издания Библии.",
                        "второканонической": "То же, что православные называют «неканоническими», но в католической традиции. На Тридентском соборе (XVI в.) такие книги включили в канон.",
                        "апокрифичной": "В протестантской традиции термин «апокрифы» применяют к тем книгам, которые православные называют «неканоническими».",
                        "приготовляли землю и воду": "Символ безоговорочной капитуляции; дипломатический ритуал, при котором завоевателям буквально преподносили горсть земли и чашу с водой.",
                        "укрепить её": "Даровать физические и духовные силы для совершения чего-либо. В данном случае — для нанесения смертельного удара."
                    },
                    en: {
                        "Venetian school": "**The Venetian school** is one of the leading painting schools of Italy. It became famous primarily for its virtuoso mastery of colour and light, rather than drawing.",
                        "unanimously attributed": "Recognised by the absolute majority of specialists as the work of this particular author.",
                        "non-canonical": "A book of the Old Testament that is not in the Hebrew canon, but which is included in Orthodox editions of the Bible.",
                        "deuterocanonical": "Essentially, the same as what the Orthodox call «non-canonical», but in the Catholic tradition. At the Council of Trent (16th century) such books were included in the canon.",
                        "apocryphal": "In the Protestant tradition, the term «apocrypha» is applied to those books that the Orthodox call «non-canonical».",
                        "prepare earth and water": "The preparation of earth and water here is a symbol of unconditional capitulation; a diplomatic ritual in which a handful of earth and a cup of water were literally presented to the conquerors.",
                        "to strengthen her": "To grant physical and spiritual strength to accomplish something. In this case — to deliver a fatal blow."
                    }
                }
            }
        ];

        function showMenu() {
            var list = document.getElementById('country-list');
            list.style.display = list.style.display === 'none' ? 'block' : 'none';
            document.getElementById('panel').classList.toggle('open');
        }

        function switchCountry(country) {
            if (country === 'france') {
                map.removeLayer(italyLayer);
                franceLayer.addTo(map);
                map.setView([46.5, 2.0], 6);
                map.eachLayer(function (layer) { if (layer instanceof L.Marker) map.removeLayer(layer); });
            } else {
                if(map.hasLayer(franceLayer)) map.removeLayer(franceLayer);
                italyLayer.addTo(map);
                map.setView([45.0, 12.0], 7);
                drawMarkers('italy');
            }
        }

        function processText(text, footnotes) {
            let processed = text;
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            if (footnotes) {
                for (const [key, val] of Object.entries(footnotes)) {
                    let searchStr = '[' + key + ']';
                    let replaceStr = `<span class="footnote" data-text="${val.replace(/"/g, '&quot;')}">${key}</span>`;
                    processed = processed.split(searchStr).join(replaceStr);
                }
            }
            return processed;
        }

        function drawMarkers(country) {
            map.eachLayer(function (layer) {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });

            artworks.forEach(function(art) {
                if (art.country === country) {
                    var formattedText = processText(art.text[currentLang], art.footnotes ? art.footnotes[currentLang] : null);
                    
                    var popupContent = `
                        <img src="${art.image}" class="popup-image" alt="${art.title[currentLang]}">
                        <h3>${art.title[currentLang]} (${art.year})</h3>
                        <p><strong>${currentLang === 'ru' ? 'Художник' : 'Artist'}:</strong> ${art.author[currentLang]}</p>
                        <p><strong>${currentLang === 'ru' ? 'Место создания' : 'Place of creation'}:</strong> ${art.city[currentLang]}</p>
                        <p><strong>${currentLang === 'ru' ? 'Место хранения' : 'Current location'}:</strong> ${art.museum[currentLang]}</p>
                        <p>${formattedText}</p>
                        <div class="audio-wrapper">
                            <p><strong>${currentLang === 'ru' ? 'Музыкальное сопровождение:' : 'Musical accompaniment:'}</strong></p>
                            <p style="font-size: 13px;">${currentLang === 'ru' ? 'Оратория Антонио Вивальди «Торжествующая Юдифь».' : 'Antonio Vivaldi\'s oratorio «Juditha triumphans».'}</p>
                            <audio controls><source src="${art.audio}" type="audio/mpeg"></audio>
                        </div>
                    `;

                    L.marker(art.coords).addTo(map).bindPopup(popupContent, { maxHeight: 500, autoPanPadding: [50, 50] });
                }
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('panel-desc').innerText = currentLang === 'ru' ? 'Интерактивная карта шедевров Возрождения.' : 'Interactive map of Renaissance masterpieces.';
            document.getElementById('btn-countries').innerText = currentLang === 'ru' ? '🏛️ Страны' : '🏛️ Countries';
            document.getElementById('btn-italy').innerText = currentLang === 'ru' ? 'Италия' : 'Italy';
            document.getElementById('btn-france').innerText = currentLang === 'ru' ? 'Франция' : 'France';
            document.getElementById('btn-renaissance').innerText = currentLang === 'ru' ? 'Высокое Возрождение' : 'High Renaissance';
            document.getElementById('feedback-text').innerText = currentLang === 'ru' ? 'Есть идея для карты?' : 'Have an idea for the map?';
            document.getElementById('feedback-link').innerText = currentLang === 'ru' ? '✉️ Написать мне' : '✉️ Write to me';
            drawMarkers('italy');
        }

        drawMarkers('italy');
    </script>
</body>
</html>
