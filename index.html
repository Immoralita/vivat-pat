<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivat-Pat | Карта Возрождения</title>
    <!-- Подключаем карту Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
            background-color: #e8dcc4; /* Цвет бумаги, пока грузится карта */
        }

        /* Выезжающая панель */
        #panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 350px;
            height: 100%;
            background-color: rgba(245, 235, 220, 0.95);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        #panel.open {
            transform: translateX(0);
        }

        #toggle-btn {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background-color: #8b5a2b;
            color: white;
            border: none;
            padding: 15px 10px;
            cursor: pointer;
            z-index: 1001;
            border-radius: 0 5px 5px 0;
            font-size: 20px;
            transition: left 0.3s ease;
        }

        #panel.open + #toggle-btn {
            left: 350px;
        }

        .panel-content {
            padding: 20px;
            overflow-y: auto;
            height: 100%;
            position: relative;
        }

        .panel-content h2 {
            margin-top: 0;
            color: #3e2723;
            border-bottom: 2px solid #8b5a2b;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: 1px solid #8b5a2b;
            color: #3e2723;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 16px;
            text-align: left;
            transition: background 0.2s;
        }
        
        .tab-btn:hover {
            background: #e0d0c0;
        }

        /* Кнопка перевода языков */
        #lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(245, 235, 220, 0.9);
            border: 1px solid #8b5a2b;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 16px;
            color: #3e2723;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-radius: 3px;
        }
        
        #lang-switch:hover {
            background: #fff;
        }

        .leaflet-popup-content {
            font-family: 'Georgia', serif;
            color: #3e2723;
            max-width: 300px;
        }

        .leaflet-popup-content h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        
        .leaflet-popup-content p {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 0;
        }

    </style>
</head>
<body>

    <!-- Кнопка смены языка -->
    <button id="lang-switch" onclick="toggleLanguage()">EN</button>

    <!-- Выезжающая панель -->
    <div id="panel">
        <div class="panel-content">
            <h2>Vivat-Pat</h2>
            <p id="panel-desc" style="font-size: 14px; color: #5d4037; margin-bottom: 20px;">Интерактивная карта шедевров Возрождения.</p>
            
            <h3 id="panel-sections">Разделы</h3>
            <button class="tab-btn" id="tab-countries">🏛️ По странам</button>
            <button class="tab-btn" id="tab-artists">👨‍🎨 По художникам</button>
            
            <hr style="border: 1px solid #8b5a2b; margin: 20px 0;">
            
            <p style="font-size: 14px;">
                <span id="feedback-text">Есть идея для карты?</span><br>
                <a href="mailto:patyukhova@gmail.com?subject=Идея для Vivat-Pat" id="feedback-link" style="color: #8b5a2b;">✉️ Написать мне</a>
            </p>
        </div>
    </div>
    
    <button id="toggle-btn">☰</button>
    <div id="map"></div>

    <script>
        var map = L.map('map', {
            minZoom: 4,
            maxZoom: 8,
            center: [42.5, 12.5], // Центр Италии
            zoom: 6,
            zoomControl: false 
        });

        var imageUrl = 'map.jpg'; 
        var imageBounds = [[36.5, 5.0], [47.5, 20.0]]; // Приблизительные границы Италии

        L.imageOverlay(imageUrl, imageBounds).addTo(map);

        // Логика панели
        var panel = document.getElementById('panel');
        var toggleBtn = document.getElementById('toggle-btn');

        toggleBtn.addEventListener('click', function() {
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                toggleBtn.innerHTML = '✕';
            } else {
                toggleBtn.innerHTML = '☰';
            }
        });

        // Данные картины
        var artworks = [
            {
                title: { ru: "Юдифь", en: "Judith" },
                year: "ок. 1502",
                city: { ru: "Санкт-Петербург (Эрмитаж)", en: "St. Petersburg (Hermitage)" },
                coords: [59.9398, 30.3146], 
                author: "Джорджоне / Giorgione",
                text: { 
                    ru: "Картина итальянского живописца Джорджоне (Джорджо Барбарелли да Кастельфранко)... (тут будет продолжение твоего текста)",
                    en: "Painting by the Italian artist Giorgione... (English text will be here later)"
                }
            }
        ];

        var currentLang = 'ru';

        // Функция для отрисовки точек
        function drawMarkers() {
            map.eachLayer(function (layer) {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });

            artworks.forEach(function(art) {
                var popupContent = `
                    <h3>${art.title[currentLang]} (${art.year})</h3>
                    <p><strong>${currentLang === 'ru' ? 'Художник' : 'Artist'}:</strong> ${art.author}</p>
                    <p><strong>${currentLang === 'ru' ? 'Где находится' : 'Location'}:</strong> ${art.city[currentLang]}</p>
                    <p>${art.text[currentLang]}</p>
                `;

                L.marker(art.coords)
                    .addTo(map)
                    .bindPopup(popupContent);
            });
        }

        // Логика перевода
        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            document.getElementById('lang-switch').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('panel-desc').innerText = currentLang === 'ru' ? 'Интерактивная карта шедевров Возрождения.' : 'Interactive map of Renaissance masterpieces.';
            document.getElementById('panel-sections').innerText = currentLang === 'ru' ? 'Разделы' : 'Sections';
            document.getElementById('tab-countries').innerText = currentLang === 'ru' ? '🏛️ По странам' : '🏛️ By Country';
            document.getElementById('tab-artists').innerText = currentLang === 'ru' ? '👨‍🎨 По художникам' : '👨‍🎨 By Artists';
            document.getElementById('feedback-text').innerText = currentLang === 'ru' ? 'Есть идея для карты?' : 'Have an idea for the map?';
            document.getElementById('feedback-link').innerText = currentLang === 'ru' ? '✉️ Написать мне' : '✉️ Write to me';

            drawMarkers();
        }

        drawMarkers();

       

    </script>
</body>
</html>
